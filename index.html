<script>

/* =====================================================
   CONFIG
===================================================== */

const SHEET_URL =
"https://docs.google.com/spreadsheets/d/1PqbleAOXsLtT1h8emp1zepyovsBOINSPNu8JTWPgm7Y/gviz/tq?tqx=out:csv";


/*
 * QUAN TRỌNG
 *
 * Đây là URL Worker R2 của bạn.
 *
 * Tất cả ảnh trong R2 sẽ được lấy qua:
 *
 * /image?key=TSPORT/...
 *
 * và gallery lấy qua:
 *
 * ?folder=/TSPORT/...
 */

const IMAGE_API =
"https://tsport-image-api.ntr9766.workers.dev/";


/* =====================================================
   DATA
===================================================== */

let products = [];

let currentGallery = [];

let currentImageIndex = 0;


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =====================================================
   IMAGE URL
===================================================== */

/*
 * Google Drive:
 *
 * https://drive.google.com/file/d/ABC/view
 *
 * vẫn được hỗ trợ.
 *
 *
 * R2:
 *
 * Nếu Sheet chứa:
 *
 * TSPORT/TSPORT YN/YN046 - Astrox 10/av.jpg
 *
 * hoặc:
 *
 * /TSPORT/TSPORT YN/YN046 - Astrox 10/av.jpg
 *
 * sẽ tự động chuyển thành:
 *
 * https://tsport-image-api.../image?key=...
 */

function getImageUrl(value) {

    if (!value) {
        return "";
    }

    let url =
        String(value).trim();

    if (!url) {
        return "";
    }


    /*
     * R2 key dạng:
     *
     * TSPORT/...
     */

    if (
        url.startsWith("TSPORT/")
    ) {

        return (
            IMAGE_API +
            "?key=" +
            encodeURIComponent(url)
        );

    }


    /*
     * R2 key dạng:
     *
     * /TSPORT/...
     */

    if (
        url.startsWith("/TSPORT/")
    ) {

        const key =
            url.replace(/^\/+/, "");

        return (
            IMAGE_API +
            "?key=" +
            encodeURIComponent(key)
        );

    }


    /*
     * URL Worker /image?key=...
     */

    if (
        url.startsWith(
            IMAGE_API + "image?"
        )
    ) {

        return url;

    }


    /*
     * Google Drive
     */

    let id = "";

    let match =
        url.match(
            /\/file\/d\/([^/]+)/
        );

    if (match) {
        id = match[1];
    }


    if (!id) {

        match =
            url.match(
                /[?&]id=([^&]+)/
            );

        if (match) {
            id = match[1];
        }

    }


    if (id) {

        return (
            "https://drive.google.com/thumbnail" +
            "?id=" +
            encodeURIComponent(id) +
            "&sz=w1000"
        );

    }


    /*
     * Nếu là URL bình thường
     * thì giữ nguyên.
     */

    return url;

}


/* =====================================================
   CSV PARSER
===================================================== */

function parseCSV(text) {

    const rows = [];

    let row = [];

    let value = "";

    let insideQuotes = false;


    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        const char = text[i];

        const next = text[i + 1];


        if (
            char === '"' &&
            insideQuotes &&
            next === '"'
        ) {

            value += '"';

            i++;

            continue;

        }


        if (char === '"') {

            insideQuotes =
                !insideQuotes;

            continue;

        }


        if (
            char === "," &&
            !insideQuotes
        ) {

            row.push(value);

            value = "";

            continue;

        }


        if (
            (
                char === "\n" ||
                char === "\r"
            ) &&
            !insideQuotes
        ) {

            if (
                char === "\r" &&
                next === "\n"
            ) {

                i++;

            }


            row.push(value);


            if (
                row.some(
                    item =>
                        item.trim() !== ""
                )
            ) {

                rows.push(row);

            }


            row = [];

            value = "";

            continue;

        }


        value += char;

    }


    if (
        value !== "" ||
        row.length > 0
    ) {

        row.push(value);


        if (
            row.some(
                item =>
                    item.trim() !== ""
            )
        ) {

            rows.push(row);

        }

    }


    if (rows.length < 1) {
        return [];
    }


    const headers =
        rows[0].map(
            header =>
                String(header)
                    .trim()
                    .replace(/^\uFEFF/, "")
        );


    return rows
        .slice(1)
        .map(rowData => {

            const item = {};


            headers.forEach(
                (header, index) => {

                    item[header] =
                        String(
                            rowData[index] ?? ""
                        ).trim();

                }
            );


            return item;

        });

}


/* =====================================================
   LOAD PRODUCTS
===================================================== */

async function loadProducts() {

    const container =
        document.getElementById(
            "products"
        );


    container.innerHTML = `
        <div class="loading">
            Đang tải sản phẩm...
        </div>
    `;


    try {

        const response =
            await fetch(
                SHEET_URL +
                "&t=" +
                Date.now(),
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Google Sheets HTTP " +
                response.status
            );

        }


        const text =
            await response.text();


        console.log(
            "Google Sheets response:",
            text.substring(0, 300)
        );


        products =
            parseCSV(text);


        console.log(
            "TSPORT - Số sản phẩm:",
            products.length
        );


        console.log(
            "TSPORT - Ví dụ sản phẩm đầu tiên:",
            products[0]
        );


        createFilters();

        displayProducts(products);


    } catch (error) {

        console.error(
            "LOAD PRODUCTS ERROR:",
            error
        );


        container.innerHTML = `
            <div class="loading">

                Không thể tải dữ liệu sản phẩm.

                <br><br>

                Kiểm tra quyền chia sẻ Google Sheet
                và Console trình duyệt.

            </div>
        `;

    }

}


/* =====================================================
   FILTERS
===================================================== */

function createFilters() {

    const brandFilter =
        document.getElementById(
            "brandFilter"
        );


    const styleFilter =
        document.getElementById(
            "styleFilter"
        );


    brandFilter.innerHTML =
        `<option value="">Tất cả hãng</option>`;


    styleFilter.innerHTML =
        `<option value="">Tất cả lối đánh</option>`;


    const brands =
        [
            ...new Set(
                products
                    .map(
                        product =>
                            product["Hãng"]
                    )
                    .filter(Boolean)
            )
        ];


    const styles =
        [
            ...new Set(
                products
                    .map(
                        product =>
                            product["Lối đánh"]
                    )
                    .filter(Boolean)
            )
        ];


    brands.forEach(brand => {

        const option =
            document.createElement(
                "option"
            );


        option.value = brand;

        option.textContent = brand;


        brandFilter.appendChild(
            option
        );

    });


    styles.forEach(style => {

        const option =
            document.createElement(
                "option"
            );


        option.value = style;

        option.textContent = style;


        styleFilter.appendChild(
            option
        );

    });

}


/* =====================================================
   PRICE
===================================================== */

function getPriceNumber(price) {

    if (!price) {
        return 0;
    }


    return Number(
        String(price)
            .replace(/[^\d]/g, "")
    ) || 0;

}


function formatPrice(price) {

    if (!price) {
        return "";
    }


    const number =
        getPriceNumber(price);


    if (!number) {
        return escapeHTML(price);
    }


    return (
        number.toLocaleString("vi-VN") +
        " ₫"
    );

}


/* =====================================================
   DATE
===================================================== */

function parseProductDate(value) {

    if (!value) {
        return 0;
    }


    const text =
        String(value).trim();


    let match =
        text.match(
            /^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?$/
        );


    if (match) {

        const day =
            Number(match[1]);

        const month =
            Number(match[2]) - 1;

        const year =
            Number(match[3]);

        const hour =
            Number(match[4] || 0);

        const minute =
            Number(match[5] || 0);

        const second =
            Number(match[6] || 0);


        return new Date(
            year,
            month,
            day,
            hour,
            minute,
            second
        ).getTime();

    }


    match =
        text.match(
            /^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?$/
        );


    if (match) {

        const year =
            Number(match[1]);

        const month =
            Number(match[2]) - 1;

        const day =
            Number(match[3]);

        const hour =
            Number(match[4] || 0);

        const minute =
            Number(match[5] || 0);

        const second =
            Number(match[6] || 0);


        return new Date(
            year,
            month,
            day,
            hour,
            minute,
            second
        ).getTime();

    }


    const timestamp =
        Date.parse(text);


    return isNaN(timestamp)
        ? 0
        : timestamp;

}


function formatDisplayDate(value) {

    if (!value) {
        return "";
    }


    const timestamp =
        parseProductDate(value);


    if (!timestamp) {

        return escapeHTML(
            String(value)
        );

    }


    const date =
        new Date(timestamp);


    const day =
        String(
            date.getDate()
        ).padStart(2, "0");


    const month =
        String(
            date.getMonth() + 1
        ).padStart(2, "0");


    const year =
        date.getFullYear();


    return (
        day +
        "/" +
        month +
        "/" +
        year
    );

}

/* =====================================================
   GET FOLDER
===================================================== */

function getFolderFromProduct(product) {

    if (!product) {

        console.error(
            "getFolderFromProduct: product không tồn tại"
        );

        return "";

    }


    const rawValue =
        product["Ảnh chi tiết"];


    if (
        rawValue === undefined ||
        rawValue === null
    ) {

        console.warn(
            "Sản phẩm không có cột 'Ảnh chi tiết':",
            product
        );

        return "";

    }


    let value =
        String(rawValue).trim();


    if (!value) {
        return "";
    }


    /*
     * Trường hợp chuẩn:
     *
     * /TSPORT/TSPORT YN/YN046 - Astrox 10
     */

    if (
        value.startsWith("/TSPORT/")
    ) {

        return value;

    }


    /*
     * Nếu Sheet lưu:
     *
     * TSPORT/TSPORT YN/YN046 - Astrox 10
     */

    if (
        value.startsWith("TSPORT/")
    ) {

        return "/" + value;

    }


    /*
     * Tương thích dữ liệu ImageKit cũ.
     */

    const imageKitMatch =
        value.match(
            /imagekit\.io\/dashboard\/media-library\/([^/?#]+)/
        );


    if (imageKitMatch) {

        try {

            let encoded =
                imageKitMatch[1]
                    .replace(/-/g, "+")
                    .replace(/_/g, "/");


            while (
                encoded.length % 4 !== 0
            ) {

                encoded += "=";

            }


            const decoded =
                decodeURIComponent(
                    atob(encoded)
                );


            if (
                decoded.startsWith("/")
            ) {

                return decoded;

            }


            return "/" + decoded;

        } catch (error) {

            console.error(
                "Không decode được link ImageKit:",
                value,
                error
            );

            return "";

        }

    }


    /*
     * Nếu Sheet chỉ lưu tên folder.
     */

    return (
        "/TSPORT/" +
        value.replace(/^\/+/, "")
    );

}


/* =====================================================
   LOAD GALLERY FROM R2
===================================================== */

async function loadGalleryImages(folder) {

    if (!folder) {

        console.warn(
            "loadGalleryImages: folder rỗng"
        );

        return [];

    }


    const url =
        IMAGE_API +
        "?folder=" +
        encodeURIComponent(folder);


    console.log(
        "===================================="
    );

    console.log(
        "TSPORT R2 GALLERY"
    );

    console.log(
        "Folder:",
        folder
    );

    console.log(
        "API URL:",
        url
    );

    console.log(
        "===================================="
    );


    try {

        const response =
            await fetch(
                url,
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "R2 Worker HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        console.log(
            "R2 Worker response:",
            data
        );


        if (
            !data ||
            !data.success ||
            !Array.isArray(
                data.images
            )
        ) {

            console.warn(
                "Worker không trả images hợp lệ:",
                data
            );

            return [];

        }


        /*
         * Worker hiện tại trả:
         *
         * image.url
         *
         * từ ImageKit.
         *
         * Nhưng HTML này sẽ chuyển
         * filePath sang R2 nếu có.
         */

        const urls =
            data.images
                .map(image => {

                    if (!image) {
                        return "";
                    }


                    /*
                     * Nếu Worker sau này
                     * trả R2 URL trực tiếp.
                     */

                    if (
                        image.r2Url
                    ) {

                        return String(
                            image.r2Url
                        ).trim();

                    }


                    /*
                     * Nếu Worker trả filePath:
                     *
                     * /TSPORT/.../1.jpg
                     */

                    if (
                        image.filePath
                    ) {

                        const filePath =
                            String(
                                image.filePath
                            ).trim();


                        if (
                            filePath.startsWith(
                                "/TSPORT/"
                            )
                        ) {

                            return (
                                IMAGE_API +
                                "?key=" +
                                encodeURIComponent(
                                    filePath.replace(
                                        /^\/+/,
                                        ""
                                    )
                                )
                            );

                        }


                        if (
                            filePath.startsWith(
                                "TSPORT/"
                            )
                        ) {

                            return (
                                IMAGE_API +
                                "?key=" +
                                encodeURIComponent(
                                    filePath
                                )
                            );

                        }

                    }


                    /*
                     * Nếu Worker trả URL
                     * thì dùng URL đó.
                     */

                    if (
                        image.url
                    ) {

                        return String(
                            image.url
                        ).trim();

                    }


                    return "";

                })
                .filter(Boolean);


        console.log(
            "Tìm thấy:",
            urls.length,
            "ảnh"
        );


        return urls;

    } catch (error) {

        console.error(
            "R2 GALLERY ERROR:",
            error
        );

        return [];

    }

}


/* =====================================================
   MODAL
===================================================== */

function showModalImage() {

    if (
        !currentGallery.length
    ) {

        return;

    }


    const modal =
        document.getElementById(
            "imageModal"
        );


    const image =
        document.getElementById(
            "modalImage"
        );


    const counter =
        document.getElementById(
            "modalCounter"
        );


    image.src =
        currentGallery[
            currentImageIndex
        ];


    counter.textContent =
        `${currentImageIndex + 1} / ${currentGallery.length}`;


    const hasMultiple =
        currentGallery.length > 1;


    document.getElementById(
        "modalPrev"
    ).style.display =
        hasMultiple
            ? "flex"
            : "none";


    document.getElementById(
        "modalNext"
    ).style.display =
        hasMultiple
            ? "flex"
            : "none";


    modal.style.display =
        "flex";


    document.body.style.overflow =
        "hidden";

}


function openGalleryImage(index) {

    if (
        !currentGallery.length
    ) {

        return;

    }


    currentImageIndex =
        index;


    showModalImage();

}


function nextImage() {

    if (
        currentGallery.length <= 1
    ) {

        return;

    }


    currentImageIndex =
        (
            currentImageIndex + 1
        ) %
        currentGallery.length;


    showModalImage();

}


function previousImage() {

    if (
        currentGallery.length <= 1
    ) {

        return;

    }


    currentImageIndex =
        (
            currentImageIndex -
            1 +
            currentGallery.length
        ) %
        currentGallery.length;


    showModalImage();

}


function closeImageModal() {

    const modal =
        document.getElementById(
            "imageModal"
        );


    modal.style.display =
        "none";


    document.body.style.overflow =
        "";


    document.getElementById(
        "modalImage"
    ).src = "";

}

/* =====================================================
   FILTER
===================================================== */

function filterProducts() {

    const search =
        document.getElementById(
            "search"
        )
        .value
        .toLowerCase()
        .trim();


    const brand =
        document.getElementById(
            "brandFilter"
        ).value;


    const style =
        document.getElementById(
            "styleFilter"
        ).value;


    const sort =
        document.getElementById(
            "sortFilter"
        ).value;


    const priceFilter =
        document.getElementById(
            "priceFilter"
        ).value;


    const filtered =
        products.filter(
            product => {

                const text =
                    Object.values(
                        product
                    )
                    .join(" ")
                    .toLowerCase();


                const price =
                    getPriceNumber(
                        product["Giá"]
                    );


                return (

                    text.includes(
                        search
                    )

                    &&

                    (
                        !brand ||
                        product["Hãng"] === brand
                    )

                    &&

                    (
                        !style ||
                        product["Lối đánh"] === style
                    )

                    &&

                    (
                        !priceFilter

                        ||

                        (
                            priceFilter ===
                            "under500" &&
                            price < 500
                        )

                        ||

                        (
                            priceFilter ===
                            "500to1000" &&
                            price >= 500 &&
                            price < 1000
                        )

                        ||

                        (
                            priceFilter ===
                            "1000to2000" &&
                            price >= 1000 &&
                            price < 2000
                        )

                        ||

                        (
                            priceFilter ===
                            "2000plus" &&
                            price >= 2000
                        )

                    )

                );

            }
        );


    if (
        sort === "newest"
    ) {

        filtered.sort(
            (a, b) => {

                const dateA =
                    parseProductDate(
                        a["Ngày đăng"]
                    );


                const dateB =
                    parseProductDate(
                        b["Ngày đăng"]
                    );


                return dateB - dateA;

            }
        );

    }


    displayProducts(
        filtered
    );

}

   KEYBOARD
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        const modal =
            document.getElementById(
                "imageModal"
            );


        if (
            modal.style.display !==
            "flex"
        ) {

            return;

        }


        if (
            event.key ===
            "ArrowRight"
        ) {

            nextImage();

        }


        if (
            event.key ===
            "ArrowLeft"
        ) {

            previousImage();

        }


        if (
            event.key ===
            "Escape"
        ) {

            closeImageModal();

        }

    }
);


/* =====================================================
   MOBILE SWIPE
===================================================== */

let touchStartX = 0;


document
    .getElementById(
        "imageModal"
    )
    .addEventListener(
        "touchstart",
        function(event) {

            if (
                event.touches.length
            ) {

                touchStartX =
                    event.touches[0]
                        .clientX;

            }

        },
        {
            passive: true
        }
    );


document
    .getElementById(
        "imageModal"
    )
    .addEventListener(
        "touchend",
        function(event) {

            if (
                !event.changedTouches.length
            ) {

                return;

            }


            const touchEndX =
                event.changedTouches[0]
                    .clientX;


            const distance =
                touchEndX -
                touchStartX;


            if (
                Math.abs(distance) <
                50
            ) {

                return;

            }


            if (
                distance < 0
            ) {

                nextImage();

            } else {

                previousImage();

            }

        },
        {
            passive: true
        }
    );
