<body>

<header>
    <div class="logo">TSPORT</div>

    <div class="subtitle">
        List vợt cầu lông lướt
    </div>
</header>

<div class="container">

    <div class="search-box">
        <input
            id="search"
            class="search"
            type="text"
            placeholder="🔎 Tìm vợt, mã, hãng..."
        >
    </div>

    <div class="filters">

        <select id="brandFilter">
            <option value="">Tất cả hãng</option>
        </select>

        <select id="styleFilter">
            <option value="">Tất cả lối đánh</option>
        </select>

    </div>

    <div id="count" class="count"></div>

    <div id="products" class="products">

        <div class="loading">
            Đang tải sản phẩm...
        </div>

    </div>

    <div id="detail" class="detail"></div>

</div>

<script>

/* =====================================================
   GOOGLE SHEETS
===================================================== */

const SHEET_URL =
"https://docs.google.com/spreadsheets/d/1PqbleAOXsLtT1h8emp1zepyovsBOINSPNu8JTWPgm7Y/gviz/tq?tqx=out:csv";

let products = [];


/* =====================================================
   GOOGLE DRIVE IMAGE
===================================================== */

function getImageUrl(url) {

    if (!url) return "";

    url = url.trim();

    let id = "";

    let match = url.match(/\/file\/d\/([^/]+)/);

    if (match) {
        id = match[1];
    }

    if (!id) {

        match = url.match(/[?&]id=([^&]+)/);

        if (match) {
            id = match[1];
        }

    }

    if (id) {

        return `https://drive.google.com/thumbnail?id=${id}&sz=w1000`;

    }

    return url;
}


/* =====================================================
   CSV PARSER
===================================================== */

function parseCSV(text) {

    const rows = [];

    let row = [];

    let value = "";

    let insideQuotes = false;

    for (let i = 0; i < text.length; i++) {

        const char = text[i];

        const next = text[i + 1];

        if (
            char === '"' &&
            insideQuotes &&
            next === '"'
        ) {

            value += '"';

            i++;

            continue;
        }

        if (char === '"') {

            insideQuotes = !insideQuotes;

            continue;
        }

        if (
            char === "," &&
            !insideQuotes
        ) {

            row.push(value);

            value = "";

            continue;
        }

        if (
            (char === "\n" || char === "\r") &&
            !insideQuotes
        ) {

            if (
                char === "\r" &&
                next === "\n"
            ) {

                i++;
            }

            row.push(value);

            if (
                row.some(
                    x => x.trim() !== ""
                )
            ) {

                rows.push(row);
            }

            row = [];

            value = "";

            continue;
        }

        value += char;
    }

    if (
        value ||
        row.length
    ) {

        row.push(value);

        if (
            row.some(
                x => x.trim() !== ""
            )
        ) {

            rows.push(row);
        }
    }

    if (rows.length < 2) {

        return [];
    }

    const headers =
        rows[0].map(
            x => x.trim().replace(/^\uFEFF/, "")
        );

    return rows
        .slice(1)
        .map(row => {

            const item = {};

            headers.forEach(
                (header, index) => {

                    item[header] =
                        (row[index] || "").trim();

                }
            );

            return item;
        });
}


/* =====================================================
   LOAD DATA
===================================================== */

async function loadProducts() {

    try {

        const response =
            await fetch(
                SHEET_URL +
                "&t=" +
                Date.now()
            );

        if (!response.ok) {

            throw new Error(
                "Không thể tải Google Sheet"
            );
        }

        const text =
            await response.text();

        products =
            parseCSV(text);

        if (!products.length) {

            throw new Error(
                "Không có dữ liệu"
            );
        }

        createFilters();

        displayProducts(products);

    } catch (error) {

        console.error(error);

        document.getElementById(
            "products"
        ).innerHTML = `

            <div class="loading">

                Không thể tải dữ liệu.

                <br><br>

                Vui lòng thử tải lại trang.

            </div>
        `;
    }
}


/* =====================================================
   FILTER OPTIONS
===================================================== */

function createFilters() {

    const brandFilter =
        document.getElementById(
            "brandFilter"
        );

    const styleFilter =
        document.getElementById(
            "styleFilter"
        );

    brandFilter.innerHTML =
        `<option value="">
            Tất cả hãng
        </option>`;

    styleFilter.innerHTML =
        `<option value="">
            Tất cả lối đánh
        </option>`;

    const brands =
        [
            ...new Set(
                products
                    .map(
                        p => p["Hãng"]
                    )
                    .filter(Boolean)
            )
        ];

    const styles =
        [
            ...new Set(
                products
                    .map(
                        p => p["Lối đánh"]
                    )
                    .filter(Boolean)
            )
        ];

    brands.forEach(
        brand => {

            const option =
                document.createElement(
                    "option"
                );

            option.value = brand;

            option.textContent = brand;

            brandFilter.appendChild(
                option
            );
        }
    );

    styles.forEach(
        style => {

            const option =
                document.createElement(
                    "option"
                );

            option.value = style;

            option.textContent = style;

            styleFilter.appendChild(
                option
            );
        }
    );
}


/* =====================================================
   PRICE
===================================================== */

function formatPrice(price) {

    if (!price) return "";

    const number =
        Number(
            String(price)
                .replace(/[^\d]/g, "")
        );

    if (!number) {

        return price;
    }

    return number.toLocaleString(
        "vi-VN"
    ) + " ₫";
}


/* =====================================================
   DISPLAY PRODUCTS
===================================================== */

function displayProducts(list) {

    const container =
        document.getElementById(
            "products"
        );

    const count =
        document.getElementById(
            "count"
        );

    container.innerHTML = "";

    count.textContent =
        `${list.length} sản phẩm`;

    if (!list.length) {

        container.innerHTML = `

            <div class="loading">

                Không tìm thấy vợt.

            </div>
        `;

        return;
    }

    list.forEach(
        product => {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "card";

            const image =
                getImageUrl(
                    product["Ảnh"]
                );

            let imageHTML = "";

            if (image) {

                imageHTML = `

                    <img
                        src="${image}"
                        alt="${escapeHTML(
                            product["Tên vợt"] || ""
                        )}"
                        loading="lazy"
                        onerror="
                            this.style.display='none';
                            this.parentElement.innerHTML +=
                            '<div class=\\'no-image\\'>Không có ảnh</div>';
                        "
                    >
                `;

            } else {

                imageHTML = `

                    <div class="no-image">
                        Không có ảnh
                    </div>
                `;
            }

            card.innerHTML = `

                <div class="image-box">

                    ${imageHTML}

                </div>

                <div class="card-info">

                    <div class="brand">

                        ${escapeHTML(
                            product["Hãng"] || ""
                        )}

                    </div>

                    <div class="name">

                        ${escapeHTML(
                            product["Tên vợt"] || ""
                        )}

                    </div>

                    <div class="price">

                        ${formatPrice(
                            product["Giá"]
                        )}

                    </div>

                    <div class="meta">

                        ${escapeHTML(
                            product["Tình trạng vợt"] || ""
                        )}

                        ·

                        ${escapeHTML(
                            product["Tình trạng cước"] || ""
                        )}

                        <br>

                        ${escapeHTML(
                            product["Lối đánh"] || ""
                        )}

                    </div>

                </div>
            `;

            card.onclick =
                () => showDetail(product);

            container.appendChild(card);
        }
    );
}


/* =====================================================
   DETAIL
===================================================== */

function showDetail(product) {

    document.getElementById(
        "products"
    ).style.display = "none";

    document.getElementById(
        "count"
    ).style.display = "none";

    document.querySelector(
        ".filters"
    ).style.display = "none";

    document.querySelector(
        ".search-box"
    ).style.display = "none";

    const detail =
        document.getElementById(
            "detail"
        );

    detail.style.display =
        "block";

    const image =
        getImageUrl(
            product["Ảnh"]
        );

    let imageHTML = "";

    if (image) {

        imageHTML = `

            <img
                class="detail-image"
                src="${image}"
                alt=""
                onerror="
                    this.style.display='none';
                "
            >
        `;

    } else {

        imageHTML = `

            <div class="no-image">
                Không có ảnh
            </div>
        `;
    }


    /* =================================================
       ẢNH CHI TIẾT
    ================================================= */

    let detailLink = "";

    if (
        product["Ảnh chi tiết"] &&
        product["Ảnh chi tiết"].trim() !== ""
    ) {

        detailLink = `

            <a
                class="detail-link"
                href="${escapeAttribute(
                    product["Ảnh chi tiết"]
                )}"
                target="_blank"
                rel="noopener noreferrer"
            >

                🖼️ Xem ảnh chi tiết

            </a>
        `;

    } else {

        detailLink = `

            <div
                style="
                    margin-top:20px;
                    color:#999;
                    font-size:14px;
                "
            >

                Chưa có ảnh chi tiết

            </div>
        `;
    }


    detail.innerHTML = `

        <button
            class="back"
            onclick="closeDetail()"
        >

            ← Quay lại

        </button>


        <div class="detail-image-box">

            ${imageHTML}

        </div>


        <div class="detail-content">

            <div class="detail-brand">

                ${escapeHTML(
                    product["Hãng"] || ""
                )}

            </div>


            <div class="detail-name">

                ${escapeHTML(
                    product["Tên vợt"] || ""
                )}

            </div>


            <div class="detail-price">

                ${formatPrice(
                    product["Giá"]
                )}

            </div>


            <div class="info-row">

                <strong>Mã:</strong>

                ${escapeHTML(
                    product["Mã"] || ""
                )}

            </div>


            <div class="info-row">

                <strong>Tình trạng cước:</strong>

                ${escapeHTML(
                    product["Tình trạng cước"] || ""
                )}

            </div>


            <div class="info-row">

                <strong>Tình trạng vợt:</strong>

                ${escapeHTML(
                    product["Tình trạng vợt"] || ""
                )}

            </div>


            <div class="info-row">

                <strong>Lối đánh:</strong>

                ${escapeHTML(
                    product["Lối đánh"] || ""
                )}

            </div>


            <div class="info-row">

                <strong>Ghi chú:</strong>

                ${escapeHTML(
                    product["Ghi chú"] || ""
                )}

            </div>


            ${detailLink}

        </div>

    `;

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* =====================================================
   CLOSE DETAIL
===================================================== */

function closeDetail() {

    document.getElementById(
        "products"
    ).style.display =
        "grid";

    document.getElementById(
        "count"
    ).style.display =
        "block";

    document.querySelector(
        ".filters"
    ).style.display =
        "flex";

    document.querySelector(
        ".search-box"
    ).style.display =
        "block";

    document.getElementById(
        "detail"
    ).style.display =
        "none";
}


/* =====================================================
   SEARCH + FILTER
===================================================== */

function filterProducts() {

    const search =
        document.getElementById(
            "search"
        )
        .value
        .toLowerCase()
        .trim();

    const brand =
        document.getElementById(
            "brandFilter"
        ).value;

    const style =
        document.getElementById(
            "styleFilter"
        ).value;

    const filtered =
        products.filter(
            product => {

                const text =
                    Object.values(product)
                        .join(" ")
                        .toLowerCase();

                return (

                    text.includes(search)

                    &&

                    (
                        !brand ||
                        product["Hãng"] === brand
                    )

                    &&

                    (
                        !style ||
                        product["Lối đánh"] === style
                    )
                );
            }
        );

    displayProducts(
        filtered
    );
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =====================================================
   ESCAPE ATTRIBUTE
===================================================== */

function escapeAttribute(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}


/* =====================================================
   EVENTS
===================================================== */

document
    .getElementById("search")
    .addEventListener(
        "input",
        filterProducts
    );

document
    .getElementById("brandFilter")
    .addEventListener(
        "change",
        filterProducts
    );

document
    .getElementById("styleFilter")
    .addEventListener(
        "change",
        filterProducts
    );


/* =====================================================
   START
===================================================== */

loadProducts();

</script>

</body>
</html>
