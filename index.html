<!DOCTYPE html>

<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TSPORT - List vợt cầu lông lướt</title>

<style>
* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f6f8;
    color: #171717;
}

/* HEADER */

header {
    background: #111;
    color: white;
    padding: 28px 18px;
    text-align: center;
}

.logo {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 1px;
}

.subtitle {
    margin-top: 7px;
    color: #bbb;
    font-size: 15px;
}

/* CONTAINER */

.container {
    width: 100%;
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

/* SEARCH */

.search-box {
    position: relative;
    margin-bottom: 15px;
}

.search {
    width: 100%;
    padding: 15px 18px;
    border: 1px solid #ddd;
    border-radius: 12px;
    background: white;
    font-size: 16px;
    outline: none;
}

.search:focus {
    border-color: #888;
}

/* FILTERS */

.filters {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

select {
    border: 1px solid #ddd;
    background: white;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 15px;
    outline: none;
}

/* COUNT */

.count {
    color: #777;
    font-size: 14px;
    margin-bottom: 15px;
}

/* PRODUCTS */

.products {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
}

/* CARD */

.card {
    background: white;
    border-radius: 16px;
    overflow: hidden;
    cursor: pointer;
    transition: 0.2s ease;
    box-shadow: 0 3px 15px rgba(0,0,0,0.06);
}

.card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 25px rgba(0,0,0,0.1);
}

.image-box {
    width: 100%;
    height: 260px;
    background: #fafafa;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.image-box img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.no-image {
    color: #aaa;
    font-size: 14px;
}

.card-info {
    padding: 15px;
}

.brand {
    font-size: 13px;
    color: #777;
    margin-bottom: 4px;
}

.name {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.3;
}

.price {
    margin-top: 10px;
    font-size: 19px;
    font-weight: 800;
}

.meta {
    margin-top: 8px;
    color: #666;
    font-size: 13px;
    line-height: 1.6;
}

/* DETAIL */

.detail {
    display: none;
    background: white;
    border-radius: 16px;
    padding: 20px;
}

.back {
    border: none;
    background: #111;
    color: white;
    padding: 11px 16px;
    border-radius: 9px;
    cursor: pointer;
    font-size: 14px;
    margin-bottom: 20px;
}

/* MAIN IMAGE */

.detail-image-box {
    width: 100%;
    max-width: 700px;
    height: 500px;
    margin: auto;
    background: #fafafa;
    border-radius: 14px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
}

.detail-image {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

/* CAROUSEL */

.detail-carousel {
    width: 100%;
    max-width: 700px;
    margin: auto;
}

.carousel-main {
    position: relative;
}

.carousel-button {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 50%;
    background: rgba(0,0,0,0.65);
    color: white;
    font-size: 24px;
    cursor: pointer;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
}

.carousel-button:hover {
    background: rgba(0,0,0,0.85);
}

.carousel-prev {
    left: 12px;
}

.carousel-next {
    right: 12px;
}

.carousel-counter {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.65);
    color: white;
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 13px;
    z-index: 5;
}

.carousel-thumbnails {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 12px 2px 4px;
    scrollbar-width: thin;
}

.carousel-thumb {
    width: 75px;
    height: 75px;
    flex: 0 0 75px;
    border-radius: 9px;
    overflow: hidden;
    border: 2px solid transparent;
    background: #f5f5f5;
    cursor: pointer;
}

.carousel-thumb.active {
    border-color: #111;
}

.carousel-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.carousel-loading {
    width: 100%;
    max-width: 700px;
    height: 500px;
    margin: auto;
    background: #fafafa;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #888;
}

/* DETAIL CONTENT */

.detail-content {
    max-width: 700px;
    margin: 25px auto 0;
}

.detail-brand {
    color: #777;
    font-size: 15px;
}

.detail-name {
    font-size: 32px;
    font-weight: 800;
    margin-top: 5px;
}

.detail-price {
    font-size: 28px;
    font-weight: 800;
    margin: 15px 0;
}

.info-row {
    padding: 10px 0;
    border-bottom: 1px solid #eee;
    font-size: 15px;
}

.info-row strong {
    display: inline-block;
    width: 150px;
}

/* LOADING */

.loading {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    color: #777;
}

/* MOBILE */

@media (max-width: 900px) {

    .products {
        grid-template-columns: repeat(3, 1fr);
    }

    .image-box {
        height: 220px;
    }
}

@media (max-width: 650px) {

    header {
        padding: 23px 15px;
    }

    .logo {
        font-size: 25px;
    }

    .container {
        padding: 12px;
    }

    .products {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
    }

    .image-box {
        height: 190px;
    }

    .card-info {
        padding: 11px;
    }

    .name {
        font-size: 16px;
    }

    .price {
        font-size: 17px;
    }

    .detail {
        padding: 12px;
    }

    .detail-image-box,
    .carousel-loading {
        height: 350px;
    }

    .detail-name {
        font-size: 25px;
    }

    .detail-price {
        font-size: 23px;
    }

    .info-row strong {
        display: block;
        width: auto;
        margin-bottom: 3px;
    }

    .carousel-thumb {
        width: 65px;
        height: 65px;
        flex-basis: 65px;
    }
}

</style>

</head>

<script>

/* =====================================================
   GOOGLE SHEETS
===================================================== */

const SHEET_URL =
"https://docs.google.com/spreadsheets/d/1PqbleAOXsLtT1h8emp1zepyovsBOINSPNu8JTWPgm7Y/gviz/tq?tqx=out:csv";


/* =====================================================
   IMAGE API
===================================================== */

const IMAGE_API =
"https://tsport-image-api.ntr9766.workers.dev";


let products = [];

let currentImages = [];

let currentImageIndex = 0;


/* =====================================================
   GOOGLE DRIVE IMAGE
===================================================== */

function getImageUrl(url) {

    if (!url) return "";

    url = url.trim();

    let id = "";

    let match =
        url.match(/\/file\/d\/([^/]+)/);

    if (match) {
        id = match[1];
    }

    if (!id) {

        match =
            url.match(/[?&]id=([^&]+)/);

        if (match) {
            id = match[1];
        }

    }

    if (id) {

        return `https://drive.google.com/thumbnail?id=${id}&sz=w1000`;

    }

    return url;
}


/* =====================================================
   GET DETAIL IMAGES
===================================================== */

async function getDetailImages(folder) {

    if (!folder) {
        return [];
    }

    try {

        let url = folder.trim();

        /*
         Nếu bạn lưu trực tiếp URL API
         thì dùng luôn.

         Nếu sau này muốn lưu tên folder
         thì có thể mở rộng thêm.
        */

        let response =
            await fetch(url);

        if (!response.ok) {
            throw new Error("Không tải được ảnh");
        }

        let data =
            await response.json();

        if (
            !data ||
            !data.images ||
            !Array.isArray(data.images)
        ) {

            return [];

        }

        return data.images
            .map(image => image.url)
            .filter(Boolean);

    } catch (error) {

        console.error(
            "Lỗi tải ảnh chi tiết:",
            error
        );

        return [];

    }

}


/* =====================================================
   CSV PARSER
===================================================== */

function parseCSV(text) {

    const rows = [];

    let row = [];

    let value = "";

    let insideQuotes = false;

    for (let i = 0; i < text.length; i++) {

        const char = text[i];

        const next = text[i + 1];

        if (
            char === '"' &&
            insideQuotes &&
            next === '"'
        ) {

            value += '"';

            i++;

            continue;

        }

        if (char === '"') {

            insideQuotes =
                !insideQuotes;

            continue;

        }

        if (
            char === "," &&
            !insideQuotes
        ) {

            row.push(value);

            value = "";

            continue;

        }

        if (
            (char === "\n" || char === "\r") &&
            !insideQuotes
        ) {

            if (
                char === "\r" &&
                next === "\n"
            ) {

                i++;

            }

            row.push(value);

            if (
                row.some(
                    x => x.trim() !== ""
                )
            ) {

                rows.push(row);

            }

            row = [];

            value = "";

            continue;

        }

        value += char;

    }

    if (
        value ||
        row.length
    ) {

        row.push(value);

        if (
            row.some(
                x => x.trim() !== ""
            )
        ) {

            rows.push(row);

        }

    }

    if (rows.length < 2) {

        return [];

    }

    const headers =
        rows[0].map(
            x =>
                x
                .trim()
                .replace(/^\uFEFF/, "")
        );

    return rows
        .slice(1)
        .map(row => {

            const item = {};

            headers.forEach(
                (header, index) => {

                    item[header] =
                        (row[index] || "")
                        .trim();

                }
            );

            return item;

        });

}


/* =====================================================
   LOAD DATA
===================================================== */

async function loadProducts() {

    try {

        const response =
            await fetch(
                SHEET_URL +
                "&t=" +
                Date.now()
            );

        if (!response.ok) {

            throw new Error(
                "Không thể tải Google Sheet"
            );

        }

        const text =
            await response.text();

        products =
            parseCSV(text);

        if (!products.length) {

            throw new Error(
                "Không có dữ liệu"
            );

        }

        createFilters();

        displayProducts(products);

    } catch (error) {

        console.error(error);

        document.getElementById(
            "products"
        ).innerHTML = `

            <div class="loading">

                Không thể tải dữ liệu.

                <br><br>

                Vui lòng thử tải lại trang.

            </div>

        `;

    }

}


/* =====================================================
   FILTER OPTIONS
===================================================== */

function createFilters() {

    const brandFilter =
        document.getElementById(
            "brandFilter"
        );

    const styleFilter =
        document.getElementById(
            "styleFilter"
        );

    brandFilter.innerHTML =
        `<option value="">
            Tất cả hãng
        </option>`;

    styleFilter.innerHTML =
        `<option value="">
            Tất cả lối đánh
        </option>`;

    const brands =
        [
            ...new Set(
                products
                    .map(
                        p => p["Hãng"]
                    )
                    .filter(Boolean)
            )
        ];

    const styles =
        [
            ...new Set(
                products
                    .map(
                        p => p["Lối đánh"]
                    )
                    .filter(Boolean)
            )
        ];

    brands.forEach(
        brand => {

            const option =
                document.createElement(
                    "option"
                );

            option.value = brand;

            option.textContent =
                brand;

            brandFilter.appendChild(
                option
            );

        }
    );

    styles.forEach(
        style => {

            const option =
                document.createElement(
                    "option"
                );

            option.value = style;

            option.textContent =
                style;

            styleFilter.appendChild(
                option
            );

        }
    );

}


/* =====================================================
   PRICE
===================================================== */

function formatPrice(price) {

    if (!price) return "";

    const number =
        Number(
            String(price)
                .replace(/[^\d]/g, "")
        );

    if (!number) {

        return price;

    }

    return number.toLocaleString(
        "vi-VN"
    ) + " ₫";

}


/* =====================================================
   DISPLAY PRODUCTS
===================================================== */

function displayProducts(list) {

    const container =
        document.getElementById(
            "products"
        );

    const count =
        document.getElementById(
            "count"
        );

    container.innerHTML = "";

    count.textContent =
        `${list.length} sản phẩm`;

    if (!list.length) {

        container.innerHTML = `

            <div class="loading">

                Không tìm thấy vợt.

            </div>

        `;

        return;

    }

    list.forEach(
        product => {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "card";

            const image =
                getImageUrl(
                    product["Ảnh"]
                );

            let imageHTML = "";

            if (image) {

                imageHTML = `

                    <img
                        src="${image}"
                        alt="${escapeHTML(
                            product["Tên vợt"] || ""
                        )}"
                        loading="lazy"
                        onerror="
                            this.style.display='none';
                            this.parentElement.innerHTML +=
                            '<div class=\\'no-image\\'>Không có ảnh</div>';
                        "
                    >

                `;

            } else {

                imageHTML = `

                    <div class="no-image">
                        Không có ảnh
                    </div>

                `;

            }

            card.innerHTML = `

                <div class="image-box">

                    ${imageHTML}

                </div>

                <div class="card-info">

                    <div class="brand">

                        ${escapeHTML(
                            product["Hãng"] || ""
                        )}

                    </div>

                    <div class="name">

                        ${escapeHTML(
                            product["Tên vợt"] || ""
                        )}

                    </div>

                    <div class="price">

                        ${formatPrice(
                            product["Giá"]
                        )}

                    </div>

                    <div class="meta">

                        ${escapeHTML(
                            product["Tình trạng vợt"] || ""
                        )}

                        ·

                        ${escapeHTML(
                            product["Tình trạng cước"] || ""
                        )}

                        <br>

                        ${escapeHTML(
                            product["Lối đánh"] || ""
                        )}

                    </div>

                </div>

            `;

            card.onclick =
                () => showDetail(product);

            container.appendChild(card);

        }
    );

}


/* =====================================================
   DETAIL
===================================================== */

async function showDetail(product) {

    document.getElementById(
        "products"
    ).style.display = "none";

    document.getElementById(
        "count"
    ).style.display = "none";

    document.querySelector(
        ".filters"
    ).style.display = "none";

    document.querySelector(
        ".search-box"
    ).style.display = "none";

    const detail =
        document.getElementById(
            "detail"
        );

    detail.style.display =
        "block";

    detail.innerHTML = `

        <button
            class="back"
            onclick="closeDetail()"
        >
            ← Quay lại
        </button>

        <div class="detail-carousel">

            <div class="carousel-main">

                <div class="carousel-loading">

                    Đang tải ảnh chi tiết...

                </div>

            </div>

        </div>

        <div class="detail-content">

            <div class="detail-brand">

                ${escapeHTML(
                    product["Hãng"] || ""
                )}

            </div>

            <div class="detail-name">

                ${escapeHTML(
                    product["Tên vợt"] || ""
                )}

            </div>

            <div class="detail-price">

                ${formatPrice(
                    product["Giá"]
                )}

            </div>

            <div class="info-row">

                <strong>Mã:</strong>

                ${escapeHTML(
                    product["Mã"] || ""
                )}

            </div>

            <div class="info-row">

                <strong>Tình trạng cước:</strong>

                ${escapeHTML(
                    product["Tình trạng cước"] || ""
                )}

            </div>

            <div class="info-row">

                <strong>Tình trạng vợt:</strong>

                ${escapeHTML(
                    product["Tình trạng vợt"] || ""
                )}

            </div>

            <div class="info-row">

                <strong>Lối đánh:</strong>

                ${escapeHTML(
                    product["Lối đánh"] || ""
                )}

            </div>

            <div class="info-row">

                <strong>Ghi chú:</strong>

                ${escapeHTML(
                    product["Ghi chú"] || ""
                )}

            </div>

        </div>

    `;

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

    /*
       Lấy toàn bộ ảnh từ API
    */

    const images =
        await getDetailImages(
            product["Ảnh chi tiết"]
        );

    currentImages =
        images;

    currentImageIndex = 0;

    renderCarousel();

}


/* =====================================================
   RENDER CAROUSEL
===================================================== */

function renderCarousel() {

    const carousel =
        document.querySelector(
            ".detail-carousel"
        );

    if (!carousel) return;

    if (!currentImages.length) {

        carousel.innerHTML = `

            <div class="carousel-loading">

                Không có ảnh chi tiết

            </div>

        `;

        return;

    }

    const image =
        currentImages[
            currentImageIndex
        ];

    let thumbnails = "";

    currentImages.forEach(
        (url, index) => {

            thumbnails += `

                <div
                    class="carousel-thumb ${
                        index === currentImageIndex
                            ? "active"
                            : ""
                    }"
                    onclick="goToImage(${index})"
                >

                    <img
                        src="${url}"
                        loading="lazy"
                        alt=""
                    >

                </div>

            `;

        }
    );

    carousel.innerHTML = `

        <div class="carousel-main">

            <div class="detail-image-box">

                <img
                    class="detail-image"
                    src="${image}"
                    alt="Ảnh chi tiết"
                >

            </div>

            ${
                currentImages.length > 1
                    ? `

                        <button
                            class="carousel-button carousel-prev"
                            onclick="previousImage()"
                        >
                            ‹
                        </button>

                        <button
                            class="carousel-button carousel-next"
                            onclick="nextImage()"
                        >
                            ›
                        </button>

                        <div class="carousel-counter">

                            ${
                                currentImageIndex + 1
                            }
                            /
                            ${
                                currentImages.length
                            }

                        </div>

                    `
                    : ""
            }

        </div>

        ${
            currentImages.length > 1
                ? `

                    <div class="carousel-thumbnails">

                        ${thumbnails}

                    </div>

                `
                : ""
        }

    `;

}


/* =====================================================
   CAROUSEL CONTROLS
===================================================== */

function nextImage() {

    if (!currentImages.length)
        return;

    currentImageIndex++;

    if (
        currentImageIndex >=
        currentImages.length
    ) {

        currentImageIndex = 0;

    }

    renderCarousel();

}


function previousImage() {

    if (!currentImages.length)
        return;

    currentImageIndex--;

    if (
        currentImageIndex < 0
    ) {

        currentImageIndex =
            currentImages.length - 1;

    }

    renderCarousel();

}


function goToImage(index) {

    if (
        index < 0 ||
        index >= currentImages.length
    ) {

        return;

    }

    currentImageIndex =
        index;

    renderCarousel();

}


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        const detail =
            document.getElementById(
                "detail"
            );

        if (
            detail.style.display !==
            "block"
        ) {

            return;

        }

        if (
            event.key === "ArrowRight"
        ) {

            nextImage();

        }

        if (
            event.key === "ArrowLeft"
        ) {

            previousImage();

        }

        if (
            event.key === "Escape"
        ) {

            closeDetail();

        }

    }
);


/* =====================================================
   CLOSE DETAIL
===================================================== */

function closeDetail() {

    document.getElementById(
        "products"
    ).style.display =
        "grid";

    document.getElementById(
        "count"
    ).style.display =
        "block";

    document.querySelector(
        ".filters"
    ).style.display =
        "flex";

    document.querySelector(
        ".search-box"
    ).style.display =
        "block";

    document.getElementById(
        "detail"
    ).style.display =
        "none";

    currentImages = [];

    currentImageIndex = 0;

}


/* =====================================================
   SEARCH + FILTER
===================================================== */

function filterProducts() {

    const search =
        document.getElementById(
            "search"
        )
        .value
        .toLowerCase()
        .trim();

    const brand =
        document.getElementById(
            "brandFilter"
        ).value;

    const style =
        document.getElementById(
            "styleFilter"
        ).value;

    const filtered =
        products.filter(
            product => {

                const text =
                    Object.values(product)
                        .join(" ")
                        .toLowerCase();

                return (

                    text.includes(search)

                    &&

                    (
                        !brand ||
                        product["Hãng"] === brand
                    )

                    &&

                    (
                        !style ||
                        product["Lối đánh"] === style
                    )

                );

            }
        );

    displayProducts(
        filtered
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =====================================================
   EVENTS
===================================================== */

document
    .getElementById("search")
    .addEventListener(
        "input",
        filterProducts
    );

document
    .getElementById("brandFilter")
    .addEventListener(
        "change",
        filterProducts
    );

document
    .getElementById("styleFilter")
    .addEventListener(
        "change",
        filterProducts
    );


/* =====================================================
   START
===================================================== */

loadProducts();

</script>
