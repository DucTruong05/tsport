"use strict";

/* =====================================================
   CONFIG
===================================================== */

const SHEET_URL =
    "https://docs.google.com/spreadsheets/d/1PqbleAOXsLtT1h8emp1zepyovsBOINSPNu8JTWPgm7Y/gviz/tq?tqx=out:csv";

const IMAGE_API =
    "https://tsport-image-api.ntr9766.workers.dev/";

const REQUEST_TIMEOUT = 15000;


/* =====================================================
   DATA
===================================================== */

let products = [];

let currentGallery = [];

let currentImageIndex = 0;


/* =====================================================
   DOM
===================================================== */

    document.getElementById("products");

const countElement =

const searchElement =
    document.getElementById("search");

const modalNext =
    document.getElementById("modalNext");

const modalClose =
    document.getElementById("modalClose");


/* =====================================================
   SAFE FETCH
===================================================== */

async function fetchWithTimeout(
    url,
    options = {},
    timeout = REQUEST_TIMEOUT
) {

    const controller =
        new AbortController();

    const timer =
        setTimeout(
            () => controller.abort(),
            timeout
        );

    try {

        const response =
            await fetch(
                url,
                {
                    ...options,
                    signal:
                        controller.signal
                }
            );

        return response;

    } finally {

        clearTimeout(timer);

    }

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =====================================================
   IMAGE URL
===================================================== */

function getImageUrl(url) {

    if (!url) {
        return "";
    }

    const cleanUrl =
        String(url).trim();

    if (!cleanUrl) {
        return "";
    }

    let id = "";

    let match =
        cleanUrl.match(
            /\/file\/d\/([^/]+)/
        );

    if (match) {
        id = match[1];
    }

    if (!id) {

        match =
            cleanUrl.match(
                /[?&]id=([^&]+)/
            );

        if (match) {
            id = match[1];
        }

    }

    if (id) {

        return (
            "https://drive.google.com/thumbnail" +
            "?id=" +
            encodeURIComponent(id) +
            "&sz=w1000"
        );

    }

    return cleanUrl;

}


/* =====================================================
   CSV PARSER
===================================================== */

function parseCSV(text) {

    const rows = [];

    let row = [];

    let value = "";

    let insideQuotes = false;

    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        const char = text[i];

        const next =
            text[i + 1];

        if (
            char === '"' &&
            insideQuotes &&
            next === '"'
        ) {

            value += '"';

            i++;

            continue;

        }

        if (char === '"') {

            insideQuotes =
                !insideQuotes;

            continue;

        }

        if (
            char === "," &&
            !insideQuotes
        ) {

            row.push(value);

            value = "";

            continue;

        }

        if (
            (
                char === "\n" ||
                char === "\r"
            ) &&
            !insideQuotes
        ) {

            if (
                char === "\r" &&
                next === "\n"
            ) {

                i++;

            }

            row.push(value);

            if (
                row.some(
                    cell =>
                        cell.trim() !== ""
                )
            ) {

                rows.push(row);

            }

            row = [];

            value = "";

            continue;

        }

        value += char;

    }

    if (
        value !== "" ||
        row.length > 0
    ) {

        row.push(value);

        if (
            row.some(
                cell =>
                    cell.trim() !== ""
            )
        ) {

            rows.push(row);

        }

    }

    if (rows.length < 1) {
        return [];
    }

    const headers =
        rows[0].map(
            header =>
                String(header)
                    .trim()
                    .replace(
                        /^\uFEFF/,
                        ""
                    )
        );

    return rows
        .slice(1)
        .map(rowData => {

            const item = {};

            headers.forEach(
                (header, index) => {

                    if (!header) {
                        return;
                    }

                    item[header] =
                        String(
                            rowData[index] ?? ""
                        ).trim();

                }
            );

            return item;

        });

}


/* =====================================================
   LOAD PRODUCTS
===================================================== */

async function loadProducts() {

    productsElement.innerHTML = `
        <div class="loading">
            Đang tải sản phẩm...
        </div>
    `;

    countElement.textContent =
        "Đang tải...";

    try {

        const response =
            await fetchWithTimeout(
                SHEET_URL +
                "&t=" +
                Date.now()
            );

        if (!response.ok) {

            throw new Error(
                "Google Sheets trả về lỗi " +
                response.status
            );

        }

        const text =
            await response.text();

        const data =
            parseCSV(text);

        products = data;

        createFilters();

        displayProducts(
            products
        );

        console.log(
            "Đã tải:",
            products.length,
            "sản phẩm"
        );

    } catch (error) {

        console.error(
            "Lỗi tải sản phẩm:",
            error
        );

        products = [];

        countElement.textContent =
            "Không tải được dữ liệu";

        productsElement.innerHTML = `
            <div class="error-box">
                <strong>Không thể tải danh sách vợt.</strong>
                <br><br>
                Kiểm tra Google Sheets hoặc kết nối mạng rồi tải lại trang.
            </div>
        `;

    }

}


/* =====================================================
   FILTERS
===================================================== */

function createFilters() {

    brandFilterElement.innerHTML =
        `<option value="">Tất cả hãng</option>`;

    styleFilterElement.innerHTML =
        `<option value="">Tất cả lối đánh</option>`;

    const brands =
        [
            ...new Set(
                products
                    .map(
                        product =>
                            product["Hãng"]
                    )
                    .filter(Boolean)
            )
        ]
        .sort();

    const styles =
        [
            ...new Set(
                products
                    .map(
                        product =>
                            product["Lối đánh"]
                    )
                    .filter(Boolean)
            )
        ]
        .sort();

    brands.forEach(
        brand => {

            const option =
                document.createElement(
                    "option"
                );

            option.value = brand;
            option.textContent = brand;

            brandFilterElement.appendChild(
                option
            );

        }
    );

    styles.forEach(
        style => {

            const option =
                document.createElement(
                    "option"
                );

            option.value = style;
            option.textContent = style;

            styleFilterElement.appendChild(
                option
            );

        }
    );

}


/* =====================================================
   PRICE
===================================================== */

function formatPrice(price) {

    if (!price) {
        return "";
    }

    const raw =
        String(price).trim();

    const number =
        Number(
            raw.replace(
                /[^\d]/g,
                ""
            )
        );

    if (!number) {
        return escapeHTML(raw);
    }

    return (
        number.toLocaleString("vi-VN") +
        " ₫"
    );

}


/* =====================================================
   DISPLAY PRODUCTS
===================================================== */

function displayProducts(list) {

    productsElement.innerHTML = "";

    countElement.textContent =
        `${list.length} sản phẩm`;

    if (!list.length) {

        productsElement.innerHTML = `
            <div class="loading">
                Không tìm thấy vợt.
            </div>
        `;

        return;

    }

    const fragment =
        document.createDocumentFragment();

    list.forEach(
        product => {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "card";

            const image =
                getImageUrl(
                    product["Ảnh"]
                );

            let imageHTML;

            if (image) {

                imageHTML = `
                    <img
                        src="${escapeHTML(image)}"
                        alt="${escapeHTML(
                            product["Tên vợt"] || ""
                        )}"
                        loading="lazy"
                    >
                `;

            } else {

                imageHTML = `
                    <div class="no-image">
                        Không có ảnh
                    </div>
                `;

            }

            const hasGallery =
                Boolean(
                    product["Ảnh chi tiết"]
                );

            card.innerHTML = `

                <div class="image-box">
                    ${imageHTML}
                </div>

                <div class="card-info">

                    <div class="brand">
                        ${escapeHTML(
                            product["Hãng"] || ""
                        )}
                    </div>

                    <div class="name-row">

                        <div class="name">
                            ${escapeHTML(
                                product["Tên vợt"] || ""
                            )}
                        </div>

                        ${
                            hasGallery
                            ?
                            `
                            <button
                                class="detail-button"
                                type="button"
                            >
                                🖼️ Xem ảnh
                            </button>
                            `
                            :
                            ""
                        }

                    </div>

                    <div class="price">
                        ${formatPrice(
                            product["Giá"]
                        )}
                    </div>

                    <div class="meta">
                        ${escapeHTML(
                            product["Tình trạng vợt"] || ""
                        )}

                        ${
                            product["Tình trạng cước"]
                            ?
                            " · " +
                            escapeHTML(
                                product["Tình trạng cước"]
                            )
                            :
                            ""
                        }

                        <br>

                        ${escapeHTML(
                            product["Lối đánh"] || ""
                        )}
                    </div>

                </div>
            `;

            const mainImage =
                card.querySelector(
                    ".image-box img"
                );

            if (mainImage) {

                mainImage.addEventListener(
                    "error",
                    function() {

                        this.style.display =
                            "none";

                        const parent =
                            this.parentElement;

                        if (
                            parent &&
                            !parent.querySelector(
                                ".no-image"
                            )
                        ) {

                            const fallback =
                                document.createElement(
                                    "div"
                                );

                            fallback.className =
                                "no-image";

                            fallback.textContent =
                                "Không có ảnh";

                            parent.appendChild(
                                fallback
                            );

                        }

                    }
                );

            }

            card.addEventListener(
                "click",
                function(event) {

                    const button =
                        event.target.closest(
                            ".detail-button"
                        );

                    if (button) {
                        return;
                    }

                    showDetail(product);

                }
            );

            const button =
                card.querySelector(
                    ".detail-button"
                );

            if (button) {

                button.addEventListener(
                    "click",
                    function(event) {

                        event.preventDefault();

                        event.stopPropagation();

                        openProductGallery(
                            product
                        );

                    }
                );

            }

            fragment.appendChild(
                card
            );

        }
    );

    productsElement.appendChild(
        fragment
    );

}


/* =====================================================
   GET FOLDER
===================================================== */

function getFolderFromProduct(product) {

    const value =
        product?.["Ảnh chi tiết"];

    if (!value) {
        return "";
    }

    try {

        const url =
            new URL(
                String(value).trim()
            );

        return (
            url.searchParams.get(
                "folder"
            ) || ""
        );

    } catch {

        return "";

    }

}


/* =====================================================
   LOAD GALLERY
===================================================== */

async function loadGalleryImages(folder) {

    if (!folder) {
        return [];
    }

    try {

        const url =
            IMAGE_API +
            "?folder=" +
            encodeURIComponent(folder);

        const response =
            await fetchWithTimeout(
                url
            );

        if (!response.ok) {
            return [];
        }

        const data =
            await response.json();

        if (
            !data ||
            !data.success ||
            !Array.isArray(data.images)
        ) {

            return [];

        }

        return data.images
            .map(
                image =>
                    image &&
                    image.url
            )
            .filter(Boolean);

    } catch (error) {

        console.error(
            "Gallery error:",
            error
        );

        return [];

    }

}


/* =====================================================
   OPEN PRODUCT GALLERY
===================================================== */

async function openProductGallery(product) {

    const folder =
        getFolderFromProduct(
            product
        );

    if (!folder) {

        alert(
            "Sản phẩm này chưa có ảnh chi tiết."
        );

        return;

    }

    const button =
        event?.currentTarget;

    if (button) {
        button.disabled = true;
    }

    try {

        const urls =
            await loadGalleryImages(
                folder
            );

        if (!urls.length) {

            alert(
                "Không tìm thấy ảnh chi tiết."
            );

            return;

        }

        currentGallery =
            urls;

        currentImageIndex = 0;

        showModalImage();

    } finally {

        if (button) {
            button.disabled = false;
        }

    }

}


/* =====================================================
   SHOW MODAL IMAGE
===================================================== */

function showModalImage() {

    if (!currentGallery.length) {
        return;
    }

    modalImage.src =
        currentGallery[
            currentImageIndex
        ];

    modalCounter.textContent =
        `${currentImageIndex + 1} / ${currentGallery.length}`;

    const hasMultiple =
        currentGallery.length > 1;

    modalPrev.style.display =
        hasMultiple
        ? "flex"
        : "none";

    modalNext.style.display =
        hasMultiple
        ? "flex"
        : "none";

    imageModal.style.display =
        "flex";

    document.body.style.overflow =
        "hidden";

}


/* =====================================================
   NEXT
===================================================== */

function nextImage() {

    if (
        currentGallery.length <= 1
    ) {
        return;
    }

    currentImageIndex =
        (
            currentImageIndex + 1
        ) %
        currentGallery.length;

    showModalImage();

}


/* =====================================================
   PREVIOUS
===================================================== */

function previousImage() {

    if (
        currentGallery.length <= 1
    ) {
        return;
    }

    currentImageIndex =
        (
            currentImageIndex -
            1 +
            currentGallery.length
        ) %
        currentGallery.length;

    showModalImage();

}


/* =====================================================
   CLOSE MODAL
===================================================== */

function closeImageModal() {

    imageModal.style.display =
        "none";

    modalImage.src = "";

    document.body.style.overflow =
        "";

}

/* =====================================================
   FILTER
===================================================== */

function filterProducts() {

    const search =
        searchElement.value
            .toLowerCase()
            .trim();

    const brand =
        brandFilterElement.value;

    const style =
        styleFilterElement.value;

    const filtered =
        products.filter(
            product => {

                const text =
                    Object.values(
                        product
                    )
                    .join(" ")
                    .toLowerCase();

                return (
                    text.includes(search) &&
                    (
                        !brand ||
                        product["Hãng"] === brand
                    ) &&
                    (
                        !style ||
                        product["Lối đánh"] === style
                    )
                );

            }
        );

    displayProducts(
        filtered
    );

}


/* =====================================================
   MODAL EVENTS
===================================================== */

modalClose.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

        closeImageModal();

    }
);


modalPrev.addEventListener(
    "click",

        event.stopPropagation();

        previousImage();

    }
);


modalNext.addEventListener(

        event.stopPropagation();

        nextImage();

    }
);


imageModal.addEventListener(
    "click",

        if (
            event.target ===
            imageModal
        ) {

            closeImageModal();

        }

    }
);


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            imageModal.style.display !==
            "flex"
        ) {

            return;

        }

        if (
            event.key ===
            "ArrowRight"
        ) {

            nextImage();

        }

        if (
            event.key ===
            "ArrowLeft"
        ) {

            previousImage();

        }

        if (
            event.key ===
            "Escape"
        ) {

            closeImageModal();

        }

    }
);


/* =====================================================
   MOBILE SWIPE
===================================================== */

let touchStartX = 0;

imageModal.addEventListener(
    "touchstart",
    function(event) {

        if (
            event.touches.length
        ) {

            touchStartX =
                event.touches[0].clientX;

        }

    },
    {
        passive: true
    }
);


imageModal.addEventListener(
    "touchend",
    function(event) {

        if (
            !event.changedTouches.length
        ) {

            return;

        }

        const touchEndX =
            event.changedTouches[0].clientX;

        const distance =
            touchEndX -
            touchStartX;

        if (
            Math.abs(distance) < 50
        ) {

            return;

        }

        if (distance < 0) {

            nextImage();

        } else {

            previousImage();

        }

    },
    {
        passive: true
    }
);


/* =====================================================
   SEARCH EVENTS
===================================================== */

searchElement.addEventListener(
    "input",
    filterProducts
);

brandFilterElement.addEventListener(
    "change",
    filterProducts
);

styleFilterElement.addEventListener(
    "change",
    filterProducts
);


/* =====================================================
   START

loadProducts();
