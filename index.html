.container {

===================================================== */

.filters {

===================================================== */

    background: #fafafa;

    align-items: center;

    overflow: hidden;

    width: 100%;
    height: 100%;
    object-fit: contain;
}

.no-image {
    color: #aaa;
    font-size: 14px;
}

.card-info {
    padding: 15px;

    font-size: 13px;
    color: #777;
    margin-bottom: 4px;

}

    color: white;
    padding: 7px 9px;

    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: 0.2s ease;

.detail-button:hover {
    background: #333;
    transform: translateY(-1px);
}

.price {
    margin-top: 10px;
    font-size: 19px;
    font-weight: 800;
}

.meta {
    margin-top: 8px;
    color: #666;
    font-size: 13px;
    line-height: 1.6;
}

/* =====================================================
   DETAIL
===================================================== */

.detail {
    display: none;
    background: white;
    border-radius: 16px;
    padding: 20px;

.back {

    background: #111;

    border-radius: 9px;

    font-size: 14px;

===================================================== */

.detail-image-box {

    max-width: 700px;
    height: 500px;
    margin: auto;
    background: #fafafa;
    border-radius: 14px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.detail-image {

    height: 100%;

===================================================== */

.detail-brand {
    color: #777;

}

.detail-name {

    font-weight: 800;

}

.detail-price {

===================================================== */

    gap: 12px;

.info-row {

    border-radius: 12px;

    font-size: 17px;
    text-align: center;

.info-row strong {

    margin-bottom: 6px;

    display: none;
    position: fixed;
    z-index: 9999;
    inset: 0;
    background: rgba(0,0,0,0.94);
    align-items: center;
    justify-content: center;
    padding: 20px;
    touch-action: none;
}

.modal-image-wrap {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

.image-modal img {
    max-width: 90%;
    max-height: 88vh;
    object-fit: contain;
    user-select: none;

}

.modal-close {
    position: absolute;

    right: 22px;
    color: white;
    font-size: 38px;
    line-height: 1;
    cursor: pointer;
    z-index: 10;
}

.modal-prev,
.modal-next {
    position: absolute;
    top: 50%;

    width: 48px;
    height: 48px;
    border: none;
    border-radius: 50%;
    background: rgba(255,255,255,0.16);
    color: white;
    font-size: 30px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
    transition: 0.2s ease;
}

.modal-prev:hover,
.modal-next:hover {
    background: rgba(255,255,255,0.3);

.modal-prev {
    left: 20px;
}

.modal-next {
    right: 20px;
}

.modal-counter {

    left: 50%;

    color: white;

    border-radius: 20px;
    font-size: 14px;

/* =====================================================

<script>

/* =====================================================
   GOOGLE SHEETS
===================================================== */

const SHEET_URL =
"https://docs.google.com/spreadsheets/d/1PqbleAOXsLtT1h8emp1zepyovsBOINSPNu8JTWPgm7Y/gviz/tq?tqx=out:csv";

/* =====================================================
   CLOUDFLARE IMAGE API
===================================================== */

const IMAGE_API =
"https://tsport-image-api.ntr9766.workers.dev/";

/* =====================================================
   DATA
===================================================== */

let products = [];

let currentGallery = [];

let currentImageIndex = 0;

/* =====================================================
   GOOGLE DRIVE IMAGE
===================================================== */

function getImageUrl(url) {

    if (!url) return "";

    url = url.trim();

    let id = "";

    let match =
        url.match(
            /\/file\/d\/([^/]+)/
        );

    if (match) {

        id = match[1];

    }

    if (!id) {

        match =
            url.match(
                /[?&]id=([^&]+)/
            );

        if (match) {

            id = match[1];

        }

    }

    if (id) {

        return `
            https://drive.google.com/thumbnail
            ?id=${id}&sz=w1000
        `.replace(/\s+/g, "");

    }

    return url;

}

/* =====================================================
   CSV PARSER
===================================================== */

function parseCSV(text) {

    const rows = [];

    let row = [];

    let value = "";

    let insideQuotes = false;

    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        const char = text[i];

        const next = text[i + 1];

        if (
            char === '"' &&
            insideQuotes &&
            next === '"'
        ) {

            value += '"';

            i++;

            continue;

        }

        if (char === '"') {

            insideQuotes =
                !insideQuotes;

            continue;

        }

        if (
            char === "," &&
            !insideQuotes
        ) {

            row.push(value);

            value = "";

            continue;

        }

        if (
            (
                char === "\n" ||
                char === "\r"
            ) &&
            !insideQuotes
        ) {

            if (
                char === "\r" &&
                next === "\n"
            ) {

                i++;

            }

            row.push(value);

            if (
                row.some(
                    x =>
                        x.trim() !== ""
                )
            ) {

                rows.push(row);

            }

            row = [];

            value = "";

            continue;

        }

        value += char;

    }

    if (
        value ||
        row.length
    ) {

        row.push(value);

        if (
            row.some(
                x =>
                    x.trim() !== ""
            )
        ) {

            rows.push(row);

        }

    }

    if (rows.length < 2) {

        return [];

    }

    const headers =
        rows[0].map(
            x =>
                x
                    .trim()
                    .replace(
                        /^\uFEFF/,
                        ""
                    )
        );

    return rows
        .slice(1)
        .map(row => {

            const item = {};

            headers.forEach(
                (
                    header,
                    index
                ) => {

                    item[header] =
                        (
                            row[index] ||
                            ""
                        ).trim();

                }
            );

            return item;

        });

}

/* =====================================================
   LOAD PRODUCTS
===================================================== */

async function loadProducts() {

    try {

        const response =
            await fetch(
                SHEET_URL +
                "&t=" +
                Date.now()
            );

        if (!response.ok) {

            throw new Error(
                "Không thể tải Google Sheet"
            );

        }

        const text =
            await response.text();

        products =
            parseCSV(text);

        if (!products.length) {

            throw new Error(
                "Không có dữ liệu"
            );

        }

        createFilters();

        displayProducts(
            products
        );

    } catch (error) {

        console.error(error);

        document.getElementById(
            "products"
        ).innerHTML = `

            <div class="loading">

                Không thể tải dữ liệu.

                <br><br>

                Vui lòng thử tải lại trang.

            </div>

        `;

    }

}

/* =====================================================
   FILTER OPTIONS
===================================================== */

function createFilters() {

    const brandFilter =
        document.getElementById(
            "brandFilter"
        );

    const styleFilter =
        document.getElementById(
            "styleFilter"
        );

    brandFilter.innerHTML =
        `
        <option value="">
            Tất cả hãng
        </option>
        `;

    styleFilter.innerHTML =
        `
        <option value="">
            Tất cả lối đánh
        </option>
        `;

    const brands =
        [
            ...new Set(
                products
                    .map(
                        p =>
                            p["Hãng"]
                    )
                    .filter(Boolean)
            )
        ];

    const styles =
        [
            ...new Set(
                products
                    .map(
                        p =>
                            p["Lối đánh"]
                    )
                    .filter(Boolean)
            )
        ];

    brands.forEach(
        brand => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                brand;

            option.textContent =
                brand;

            brandFilter.appendChild(
                option
            );

        }
    );

    styles.forEach(
        style => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                style;

            option.textContent =
                style;

            styleFilter.appendChild(
                option
            );

        }
    );

}

/* =====================================================
   PRICE
===================================================== */

function formatPrice(price) {

    if (!price) return "";

    const number =
        Number(
            String(price)
                .replace(
                    /[^\d]/g,
                    ""
                )
        );

    if (!number) {

        return price;

    }

    return number.toLocaleString(
        "vi-VN"
    ) + " ₫";

}

/* =====================================================
   DISPLAY PRODUCTS
===================================================== */

function displayProducts(list) {

    const container =
        document.getElementById(
            "products"
        );

    const count =
        document.getElementById(
            "count"
        );

    container.innerHTML = "";

    count.textContent =
        `${list.length} sản phẩm`;

    if (!list.length) {

        container.innerHTML = `

            <div class="loading">

                Không tìm thấy vợt.

            </div>

        `;

        return;

    }

    list.forEach(
        product => {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "card";

            const image =
                getImageUrl(
                    product["Ảnh"]
                );

            let imageHTML = "";

            if (image) {

                imageHTML = `

                    <img
                        src="${image}"
                        alt="${escapeHTML(
                            product["Tên vợt"] || ""
                        )}"
                        loading="lazy"
                        onerror="
                            this.style.display='none';
                            this.parentElement.innerHTML +=
                            '<div class=\\'no-image\\'>Không có ảnh</div>';
                        "
                    >

                `;

            } else {

                imageHTML = `

                    <div class="no-image">

                        Không có ảnh

                    </div>

                `;

            }

            card.innerHTML = `

                <div class="image-box">

                    ${imageHTML}

                </div>

                <div class="card-info">

                    <div class="brand">

                        ${escapeHTML(
                            product["Hãng"] || ""
                        )}

                    </div>

                    <div class="name-row">

                        <div class="name">

                            ${escapeHTML(
                                product["Tên vợt"] || ""
                            )}

                        </div>

                        ${
                            product["Ảnh chi tiết"]
                            ?
                            `
                            <button
                                class="detail-button"
                                type="button"
                            >
                                🖼️ Xem ảnh
                            </button>
                            `
                            :
                            ""
                        }

                    </div>

                    <div class="price">

                        ${formatPrice(
                            product["Giá"]
                        )}

                    </div>

                    <div class="meta">

                        ${escapeHTML(
                            product["Tình trạng vợt"] || ""
                        )}

                        ·

                        ${escapeHTML(
                            product["Tình trạng cước"] || ""
                        )}

                        <br>

                        ${escapeHTML(
                            product["Lối đánh"] || ""
                        )}

                    </div>

                </div>

            `;

            /* -----------------------------------------
               CARD CLICK
            ----------------------------------------- */

            card.addEventListener(
                "click",
                function(event) {

                    if (
                        event.target.closest(
                            ".detail-button"
                        )
                    ) {

                        return;

                    }

                    showDetail(product);

                }
            );

            /* -----------------------------------------
               DETAIL BUTTON
            ----------------------------------------- */

            const detailButton =
                card.querySelector(
                    ".detail-button"
                );

            if (detailButton) {

                detailButton.addEventListener(
                    "click",
                    function(event) {

                        event.preventDefault();

                        event.stopPropagation();

                        openProductGallery(
                            product
                        );

                    }
                );

            }

            container.appendChild(
                card
            );

        }
    );

}

/* =====================================================
   GET FOLDER
===================================================== */

function getFolderFromProduct(product) {

    if (
        !product ||
        !product["Ảnh chi tiết"]
    ) {

        return "";

    }

    try {

        const detailURL =
            new URL(
                product["Ảnh chi tiết"]
            );

        return (
            detailURL.searchParams.get(
                "folder"
            ) || ""
        );

    } catch (error) {

        console.error(error);

        return "";

    }

}

/* =====================================================
   LOAD GALLERY IMAGES
===================================================== */

async function loadGalleryImages(
    folder
) {

    if (!folder) {

        return [];

    }

    try {

        const url =
            IMAGE_API +
            "?folder=" +
            encodeURIComponent(
                folder
            );

        const response =
            await fetch(url);

        if (!response.ok) {

            throw new Error(
                "Không thể tải gallery"
            );

        }

        const data =
            await response.json();

        if (
            !data.success ||
            !Array.isArray(
                data.images
            )
        ) {

            return [];

        }

        return data.images
            .map(
                image =>
                    image.url
            )
            .filter(Boolean);

    } catch (error) {

        console.error(error);

        return [];

    }

}

/* =====================================================
   OPEN PRODUCT GALLERY
===================================================== */

async function openProductGallery(product) {

    const folder =
        getFolderFromProduct(
            product
        );

    if (!folder) {

        alert(
            "Sản phẩm này chưa có ảnh chi tiết."
        );

        return;

    }

    const urls =
        await loadGalleryImages(
            folder
        );

    if (!urls.length) {

        alert(
            "Sản phẩm này chưa có ảnh chi tiết."
        );

        return;

    }

    currentGallery =
        urls;

    currentImageIndex = 0;

    showModalImage();

}

/* =====================================================
   SHOW MODAL IMAGE
===================================================== */

function showModalImage() {

    if (
        !currentGallery.length
    ) {

        return;

    }

    const modal =
        document.getElementById(
            "imageModal"
        );

    const image =
        document.getElementById(
            "modalImage"
        );

    const counter =
        document.getElementById(
            "modalCounter"
        );

    image.src =
        currentGallery[
            currentImageIndex
        ];

    counter.textContent =
        `${currentImageIndex + 1} / ${currentGallery.length}`;

    document.getElementById(
        "modalPrev"
    ).style.display =
        currentGallery.length > 1
        ? ""
        : "none";

    document.getElementById(
        "modalNext"
    ).style.display =
        currentGallery.length > 1
        ? ""
        : "none";

    modal.style.display =
        "flex";

    document.body.style.overflow =
        "hidden";

}

/* =====================================================
   NEXT IMAGE
===================================================== */

function nextImage() {

    if (
        currentGallery.length <= 1
    ) {

        return;

    }

    currentImageIndex =
        (
            currentImageIndex + 1
        )
        %
        currentGallery.length;

    showModalImage();

}

/* =====================================================
   PREVIOUS IMAGE
===================================================== */

function previousImage() {

    if (
        currentGallery.length <= 1
    ) {

        return;

    }

    currentImageIndex =
        (
            currentImageIndex - 1 +
            currentGallery.length
        )
        %
        currentGallery.length;

    showModalImage();

}

/* =====================================================
   CLOSE IMAGE MODAL
===================================================== */

function closeImageModal() {

    document.getElementById(
        "imageModal"
    ).style.display =
        "none";

    document.body.style.overflow =
        "";

}

/* =====================================================
   DETAIL
===================================================== */

function showDetail(product) {

    document.getElementById(
        "products"
    ).style.display =
        "none";

    document.getElementById(
        "count"
    ).style.display =
        "none";

    document.querySelector(
        ".filters"
    ).style.display =
        "none";

    document.querySelector(
        ".search-box"
    ).style.display =
        "none";

    const detail =
        document.getElementById(
            "detail"
        );

    detail.style.display =
        "block";

    const image =
        getImageUrl(
            product["Ảnh"]
        );

    let imageHTML = "";

    if (image) {

        imageHTML = `

            <img
                class="detail-image"
                src="${image}"
                alt="${escapeHTML(
                    product["Tên vợt"] || ""
                )}"
            >

        `;

    } else {

        imageHTML = `

            <div class="no-image">

                Không có ảnh

            </div>

        `;

    }

    detail.innerHTML = `

        <button
            class="back"
            onclick="closeDetail()"
        >

            ← Quay lại

        </button>

        <div class="detail-image-box">

            ${imageHTML}

        </div>

        <div class="detail-content">

            <div class="detail-brand">

                ${escapeHTML(
                    product["Hãng"] || ""
                )}

            </div>

            <div class="detail-name">

                ${escapeHTML(
                    product["Tên vợt"] || ""
                )}

            </div>

            <div class="detail-price">

                ${formatPrice(
                    product["Giá"]
                )}

            </div>

            <div class="info-grid">

                <div class="info-row">

                    <strong>Mã vợt</strong>

                    ${escapeHTML(
                        product["Mã"] || "-"
                    )}

                </div>

                <div class="info-row">

                    <strong>Tình trạng cước</strong>

                    ${escapeHTML(
                        product["Tình trạng cước"] || "-"
                    )}

                </div>

                <div class="info-row">

                    <strong>Tình trạng vợt</strong>

                    ${escapeHTML(
                        product["Tình trạng vợt"] || "-"
                    )}

                </div>

                <div class="info-row">

                    <strong>Lối đánh</strong>

                    ${escapeHTML(
                        product["Lối đánh"] || "-"
                    )}

                </div>

                <div class="info-row">

                    <strong>Ghi chú</strong>

                    ${escapeHTML(
                        product["Ghi chú"] || "-"
                    )}

                </div>

            </div>

        </div>

    `;

    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}

/* =====================================================
   CLOSE DETAIL
===================================================== */

function closeDetail() {

    document.getElementById(
        "products"
    ).style.display =
        "grid";

    document.getElementById(
        "count"
    ).style.display =
        "block";

    document.querySelector(
        ".filters"
    ).style.display =
        "flex";

    document.querySelector(
        ".search-box"
    ).style.display =
        "block";

    document.getElementById(
        "detail"
    ).style.display =
        "none";

    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}

/* =====================================================
   SEARCH + FILTER
===================================================== */

function filterProducts() {

    const search =
        document.getElementById(
            "search"
        )
        .value
        .toLowerCase()
        .trim();

    const brand =
        document.getElementById(
            "brandFilter"
        ).value;

    const style =
        document.getElementById(
            "styleFilter"
        ).value;

    const filtered =
        products.filter(
            product => {

                const text =
                    Object.values(
                        product
                    )
                    .join(" ")
                    .toLowerCase();

                return (

                    text.includes(
                        search
                    )

                    &&

                    (
                        !brand ||
                        product["Hãng"] ===
                        brand
                    )

                    &&

                    (
                        !style ||
                        product["Lối đánh"] ===
                        style
                    )

                );

            }
        );

    displayProducts(
        filtered
    );

}

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&"
        )

        .replace(
            /</g,
            "<"
        )

        .replace(
            />/g,
            ">"
        )

        .replace(
            /"/g,
            """
        )

        .replace(
            /'/g,
            "'"
        );

}

/* =====================================================
   MODAL EVENTS
===================================================== */

document
    .getElementById(
        "modalClose"
    )
    .addEventListener(
        "click",
        function(event) {

            event.stopPropagation();

            closeImageModal();

        }
    );

document
    .getElementById(
        "modalPrev"
    )
    .addEventListener(
        "click",
        function(event) {

            event.stopPropagation();

            previousImage();

        }
    );

document
    .getElementById(
        "modalNext"
    )
    .addEventListener(
        "click",
        function(event) {

            event.stopPropagation();

            nextImage();

        }
    );

/* =====================================================
   CLICK OUTSIDE IMAGE
===================================================== */

document
    .getElementById(
        "imageModal"
    )
    .addEventListener(
        "click",
        function(event) {

            if (
                event.target ===
                this
            ) {

                closeImageModal();

            }

        }
    );

/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        const modal =
            document.getElementById(
                "imageModal"
            );

        if (
            modal.style.display !==
            "flex"
        ) {

            return;

        }

        if (
            event.key ===
            "ArrowRight"
        ) {

            nextImage();

        }

        if (
            event.key ===
            "ArrowLeft"
        ) {

            previousImage();

        }

        if (
            event.key ===
            "Escape"
        ) {

            closeImageModal();

        }

    }
);

/* =====================================================
   MOBILE SWIPE
===================================================== */

let touchStartX = 0;

let touchEndX = 0;

const modal =
    document.getElementById(
        "imageModal"
    );

modal.addEventListener(
    "touchstart",
    function(event) {

        if (
            !event.touches.length
        ) {

            return;

        }

        touchStartX =
            event.touches[0].clientX;

    },
    {
        passive: true
    }
);

modal.addEventListener(
    "touchend",
    function(event) {

        if (
            !event.changedTouches.length
        ) {

            return;

        }

        touchEndX =
            event.changedTouches[0].clientX;

        const distance =
            touchEndX -
            touchStartX;

        const minSwipe =
            50;

        if (
            Math.abs(distance) <
            minSwipe
        ) {

            return;

        }

        if (distance < 0) {

            nextImage();

        } else {

            previousImage();

        }

    },
    {
        passive: true
    }
);

/* =====================================================
   SEARCH EVENTS
===================================================== */

document
    .getElementById(
        "search"
    )
    .addEventListener(
        "input",
        filterProducts
    );

document
    .getElementById(
        "brandFilter"
    )
    .addEventListener(
        "change",
        filterProducts
    );

document
    .getElementById(
        "styleFilter"
    )
    .addEventListener(
        "change",
        filterProducts
    );

/* =====================================================
   START
===================================================== */

loadProducts();

</script>

</body>
</html>
