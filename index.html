<script>

/* =====================================================
   GOOGLE SHEETS
===================================================== */

const SHEET_URL =
"https://docs.google.com/spreadsheets/d/1PqbleAOXsLtT1h8emp1zepyovsBOINSPNu8JTWPgm7Y/gviz/tq?tqx=out:csv";


let products = [];


/* =====================================================
   GOOGLE DRIVE IMAGE
===================================================== */

function getImageUrl(url) {

    if (!url) return "";

    url = url.trim();

    let id = "";

    let match =
        url.match(/\/file\/d\/([^/]+)/);

    if (match) {

        id = match[1];

    }


    if (!id) {

        match =
            url.match(/[?&]id=([^&]+)/);

        if (match) {

            id = match[1];

        }

    }


    if (id) {

        return `https://drive.google.com/thumbnail?id=${id}&sz=w1000`;

    }


    return url;
}


/* =====================================================
   CSV PARSER
===================================================== */

function parseCSV(text) {

    const rows = [];

    let row = [];

    let value = "";

    let insideQuotes = false;


    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        const char = text[i];

        const next = text[i + 1];


        if (
            char === '"' &&
            insideQuotes &&
            next === '"'
        ) {

            value += '"';

            i++;

            continue;

        }


        if (char === '"') {

            insideQuotes =
                !insideQuotes;

            continue;

        }


        if (
            char === "," &&
            !insideQuotes
        ) {

            row.push(value);

            value = "";

            continue;

        }


        if (
            (
                char === "\n" ||
                char === "\r"
            ) &&
            !insideQuotes
        ) {

            if (
                char === "\r" &&
                next === "\n"
            ) {

                i++;

            }


            row.push(value);


            if (
                row.some(
                    x =>
                        x.trim() !== ""
                )
            ) {

                rows.push(row);

            }


            row = [];

            value = "";

            continue;

        }


        value += char;

    }


    if (
        value ||
        row.length
    ) {

        row.push(value);


        if (
            row.some(
                x =>
                    x.trim() !== ""
            )
        ) {

            rows.push(row);

        }

    }


    if (rows.length < 2) {

        return [];

    }


    const headers =
        rows[0].map(
            x =>
                x
                    .trim()
                    .replace(
                        /^\uFEFF/,
                        ""
                    )
        );


    return rows
        .slice(1)
        .map(row => {

            const item = {};


            headers.forEach(
                (
                    header,
                    index
                ) => {

                    item[header] =
                        (
                            row[index] ||
                            ""
                        ).trim();

                }
            );


            return item;

        });

}


/* =====================================================
   LOAD DATA
===================================================== */

async function loadProducts() {

    try {

        const response =
            await fetch(
                SHEET_URL +
                "&t=" +
                Date.now()
            );


        if (!response.ok) {

            throw new Error(
                "Không thể tải Google Sheet"
            );

        }


        const text =
            await response.text();


        products =
            parseCSV(text);


        if (!products.length) {

            throw new Error(
                "Không có dữ liệu"
            );

        }


        createFilters();

        displayProducts(
            products
        );


    } catch (error) {

        console.error(error);


        document.getElementById(
            "products"
        ).innerHTML = `

            <div class="loading">

                Không thể tải dữ liệu.

                <br><br>

                Vui lòng thử tải lại trang.

            </div>

        `;

    }

}


/* =====================================================
   FILTER OPTIONS
===================================================== */

function createFilters() {

    const brandFilter =
        document.getElementById(
            "brandFilter"
        );


    const styleFilter =
        document.getElementById(
            "styleFilter"
        );


    brandFilter.innerHTML =
        `<option value="">
            Tất cả hãng
        </option>`;


    styleFilter.innerHTML =
        `<option value="">
            Tất cả lối đánh
        </option>`;


    const brands =
        [
            ...new Set(
                products
                    .map(
                        p =>
                            p["Hãng"]
                    )
                    .filter(Boolean)
            )
        ];


    const styles =
        [
            ...new Set(
                products
                    .map(
                        p =>
                            p["Lối đánh"]
                    )
                    .filter(Boolean)
            )
        ];


    brands.forEach(
        brand => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                brand;


            option.textContent =
                brand;


            brandFilter.appendChild(
                option
            );

        }
    );


    styles.forEach(
        style => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                style;


            option.textContent =
                style;


            styleFilter.appendChild(
                option
            );

        }
    );

}


/* =====================================================
   PRICE
===================================================== */

function formatPrice(price) {

    if (!price) return "";


    const number =
        Number(
            String(price)
                .replace(
                    /[^\d]/g,
                    ""
                )
        );


    if (!number) {

        return price;

    }


    return number.toLocaleString(
        "vi-VN"
    ) + " ₫";

}


/* =====================================================
   DISPLAY PRODUCTS
===================================================== */

function displayProducts(list) {

    const container =
        document.getElementById(
            "products"
        );


    const count =
        document.getElementById(
            "count"
        );


    container.innerHTML = "";


    count.textContent =
        `${list.length} sản phẩm`;


    if (!list.length) {

        container.innerHTML = `

            <div class="loading">

                Không tìm thấy vợt.

            </div>

        `;

        return;

    }


    list.forEach(
        product => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "card";


            const image =
                getImageUrl(
                    product["Ảnh"]
                );


            let imageHTML = "";


            if (image) {

                imageHTML = `

                    <img
                        src="${image}"
                        alt="${escapeHTML(
                            product["Tên vợt"] || ""
                        )}"
                        loading="lazy"
                        onerror="
                            this.style.display='none';
                        "
                    >

                `;

            } else {

                imageHTML = `

                    <div class="no-image">

                        Không có ảnh

                    </div>

                `;

            }


            card.innerHTML = `

                <div class="image-box">

                    ${imageHTML}

                </div>


                <div class="card-info">

                    <div class="brand">

                        ${escapeHTML(
                            product["Hãng"] || ""
                        )}

                    </div>


                    <div class="name">

                        ${escapeHTML(
                            product["Tên vợt"] || ""
                        )}

                    </div>


                    <div class="price">

                        ${formatPrice(
                            product["Giá"]
                        )}

                    </div>


                    <div class="meta">

                        ${escapeHTML(
                            product["Tình trạng vợt"] || ""
                        )}

                        ·

                        ${escapeHTML(
                            product["Tình trạng cước"] || ""
                        )}

                        <br>

                        ${escapeHTML(
                            product["Lối đánh"] || ""
                        )}

                    </div>

                </div>

            `;


            card.onclick =
                () =>
                    showDetail(
                        product
                    );


            container.appendChild(
                card
            );

        }
    );

}


/* =====================================================
   LOAD DETAIL GALLERY
===================================================== */

async function loadDetailGallery(
    apiUrl
) {

    const gallery =
        document.getElementById(
            "detailGallery"
        );


    if (!apiUrl) {

        gallery.innerHTML = `

            <div class="gallery-error">

                Chưa có ảnh chi tiết.

            </div>

        `;

        return;

    }


    gallery.innerHTML = `

        <div class="gallery-loading">

            ⏳ Đang tải ảnh chi tiết...

        </div>

    `;


    try {

        const response =
            await fetch(
                apiUrl +
                (
                    apiUrl.includes("?")
                    ? "&"
                    : "?"
                ) +
                "t=" +
                Date.now()
            );


        if (!response.ok) {

            throw new Error(
                "API lỗi"
            );

        }


        const data =
            await response.json();


        if (
            !data.success ||
            !Array.isArray(
                data.images
            ) ||
            !data.images.length
        ) {

            throw new Error(
                "Không có ảnh"
            );

        }


        gallery.innerHTML = "";


        data.images.forEach(
            image => {

                if (!image.url) {
                    return;
                }


                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "gallery-item";


                const img =
                    document.createElement(
                        "img"
                    );


                img.src =
                    image.url;


                img.alt =
                    image.name || "";


                img.loading =
                    "lazy";


                img.onclick =
                    event => {

                        event.stopPropagation();

                        openLightbox(
                            image.url
                        );

                    };


                item.appendChild(
                    img
                );


                gallery.appendChild(
                    item
                );

            }
        );


        if (
            !gallery.children.length
        ) {

            gallery.innerHTML = `

                <div class="gallery-error">

                    Không tìm thấy ảnh trong folder.

                </div>

            `;

        }

    } catch (error) {

        console.error(
            "Gallery error:",
            error
        );


        gallery.innerHTML = `

            <div class="gallery-error">

                Không thể tải ảnh chi tiết.

                <br>

                Vui lòng kiểm tra lại link Cloudflare.

            </div>

        `;

    }

}


/* =====================================================
   DETAIL
===================================================== */

    document.getElementById(
        "count"
    ).style.display =
        "none";


    document.querySelector(

    document.querySelector(
        ".search-box"
    ).style.display =

    const detail =
        document.getElementById(
            "detail"
        );


    detail.style.display =

    const image =
        getImageUrl(
            product["Ảnh"]
        );


    let imageHTML = "";


    if (image) {

        imageHTML = `

            <img
                class="detail-image"
                src="${image}"
                alt="${escapeHTML(
                    product["Tên vợt"] || ""
                )}"
            >

        `;

    } else {

        imageHTML = `

            <div class="no-image">

                Không có ảnh

            </div>

        `;

    }


    detail.innerHTML = `

        <button
            class="back"
            onclick="closeDetail()"
        >

            ← Quay lại

        </button>


        <!-- ẢNH CHÍNH -->

        <div class="detail-image-box">

            ${imageHTML}

        </div>


        <!-- THÔNG TIN -->

        <div class="detail-content">

            <div class="detail-brand">

                ${escapeHTML(
                    product["Hãng"] || ""
                )}

            </div>


            <div class="detail-name">

                ${escapeHTML(
                    product["Tên vợt"] || ""
                )}

            </div>


            <div class="detail-price">

                ${formatPrice(
                    product["Giá"]
                )}

            </div>


            <div class="info-row">

                <strong>Mã:</strong>

                ${escapeHTML(
                    product["Mã"] || ""
                )}

            </div>


            <div class="info-row">

                <strong>Tình trạng cước:</strong>

                ${escapeHTML(
                    product["Tình trạng cước"] || ""
                )}

            </div>


            <div class="info-row">

                <strong>Tình trạng vợt:</strong>

                ${escapeHTML(
                    product["Tình trạng vợt"] || ""
                )}

            </div>


            <div class="info-row">

                <strong>Lối đánh:</strong>

                ${escapeHTML(
                    product["Lối đánh"] || ""
                )}

            </div>


            <div class="info-row">

                <strong>Ghi chú:</strong>

                ${escapeHTML(
                    product["Ghi chú"] || ""
                )}

            </div>

        </div>


        <!-- GALLERY -->

        <div class="gallery-title">

            🖼️ Ảnh chi tiết

        </div>


        <div
            id="detailGallery"
            class="gallery"
        >

            <div class="gallery-loading">

                ⏳ Đang tải ảnh...

            </div>

        </div>

    `;


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });


    /* GỌI CLOUDFLARE */

    loadDetailGallery(
        product["Ảnh chi tiết"]
    );

}


/* =====================================================
   CLOSE DETAIL
===================================================== */

function closeDetail() {

    document.getElementById(
        "products"
    ).style.display =
        "grid";


    document.getElementById(
        "count"
    ).style.display =
        "block";


    document.querySelector(
        ".filters"
    ).style.display =
        "flex";


    document.querySelector(
        ".search-box"
    ).style.display =
        "block";


    document.getElementById(
        "detail"
    ).style.display =
        "none";

}


/* =====================================================
   LIGHTBOX
===================================================== */

function openLightbox(
    imageUrl
) {

    const lightbox =
        document.getElementById(
            "lightbox"
        );


    const image =
        document.getElementById(
            "lightboxImage"
        );


    image.src =
        imageUrl;


    lightbox.classList.add(
        "show"
    );

}


function closeLightbox() {

    document
        .getElementById(
            "lightbox"
        )
        .classList.remove(
            "show"
        );

}


/* =====================================================
   SEARCH + FILTER
===================================================== */

function filterProducts() {

    const search =
        document.getElementById(
            "search"
        )
        .value
        .toLowerCase()
        .trim();


    const brand =
        document.getElementById(
            "brandFilter"
        ).value;


    const style =
        document.getElementById(
            "styleFilter"
        ).value;


    const filtered =
        products.filter(
            product => {

                const text =
                    Object.values(
                        product
                    )
                    .join(" ")
                    .toLowerCase();


                return (

                    text.includes(
                        search
                    )

                    &&

                    (
                        !brand ||
                        product["Hãng"] === brand
                    )

                    &&

                    (
                        !style ||
                        product["Lối đánh"] === style
                    )

                );

            }
        );


    displayProducts(
        filtered
    );

}
