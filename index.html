<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TSPORT - Vợt Cầu Lông Lướt</title>

<style>

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f6f8;
    color: #171717;
}

/* =====================================================
   HEADER
===================================================== */

header {

    background:
        linear-gradient(
            rgba(0,0,0,0.55),
            rgba(0,0,0,0.55)
        ),
        url("https://postimg.cc/NLxqSxfB");

    background-size: cover;
    background-position: center;

    color: white;

    padding: 45px 18px;

    text-align: center;

}

.logo {

    font-size: 34px;

    font-weight: 800;

    letter-spacing: 1px;

}

.subtitle {

    margin-top: 8px;

    color: #eeeeee;

    font-size: 16px;

}

/* =====================================================
   CONTAINER
===================================================== */

.container {

    width: 100%;

    max-width: 1200px;

    margin: auto;

    padding: 20px;

}

/* =====================================================
   SEARCH
===================================================== */

.search-box {

    position: relative;

    margin-bottom: 15px;

}

.search {

    width: 100%;

    padding: 15px 18px;

    border: 1px solid #ddd;

    border-radius: 12px;

    background: white;

    font-size: 16px;

    outline: none;

}

.search:focus {

    border-color: #888;

}

/* =====================================================
   FILTERS
===================================================== */

.filters {

    display: flex;

    gap: 10px;

    flex-wrap: wrap;

    margin-bottom: 20px;

}

select {

    border: 1px solid #ddd;

    background: white;

    border-radius: 10px;

    padding: 12px 14px;

    font-size: 15px;

    outline: none;

}

/* =====================================================
   COUNT
===================================================== */

.count {

    color: #777;

    font-size: 14px;

    margin-bottom: 15px;

}

/* =====================================================
   PRODUCTS
===================================================== */

.products {

    display: grid;

    grid-template-columns: repeat(4, 1fr);

    gap: 18px;

}

/* =====================================================
   CARD
===================================================== */

.card {

    background: white;

    border-radius: 16px;

    overflow: hidden;

    cursor: pointer;

    transition: 0.2s ease;

    box-shadow:
        0 3px 15px rgba(0,0,0,0.06);

}

.card:hover {

    transform: translateY(-4px);

    box-shadow:
        0 8px 25px rgba(0,0,0,0.1);

}

.image-box {

    width: 100%;

    height: 260px;

    background: #fafafa;

    display: flex;

    align-items: center;

    justify-content: center;

    overflow: hidden;

}

.image-box img {

    width: 100%;

    height: 100%;

    object-fit: contain;

}

.no-image {

    color: #aaa;

    font-size: 14px;

}

.card-info {

    padding: 15px;

}

.brand {

    font-size: 13px;

    color: #777;

    margin-bottom: 4px;

}

.name {

    font-size: 18px;

    font-weight: 700;

    line-height: 1.3;

}

.price {

    margin-top: 10px;

    font-size: 19px;

    font-weight: 800;

}

.meta {

    margin-top: 8px;

    color: #666;

    font-size: 13px;

    line-height: 1.6;

}

/* =====================================================
   DETAIL
===================================================== */

.detail {

    display: none;

    background: white;

    border-radius: 16px;

    padding: 20px;

}

.back {

    border: none;

    background: #111;

    color: white;

    padding: 11px 16px;

    border-radius: 9px;

    cursor: pointer;

    font-size: 14px;

    margin-bottom: 25px;

}

/* =====================================================
   DETAIL MAIN IMAGE
===================================================== */

.detail-image-box {

    width: 100%;

    max-width: 700px;

    height: 500px;

    margin: auto;

    background: #fafafa;

    border-radius: 14px;

    display: flex;

    justify-content: center;

    align-items: center;

    overflow: hidden;

}

.detail-image {

    width: 100%;

    height: 100%;

    object-fit: contain;

}

/* =====================================================
   DETAIL CONTENT
===================================================== */

.detail-content {

    max-width: 800px;

    margin: 30px auto 0;

    text-align: center;

}

.detail-brand {

    color: #777;

    font-size: 17px;

}

.detail-name {

    font-size: 34px;

    font-weight: 800;

    margin-top: 7px;

}

.detail-price {

    font-size: 30px;

    font-weight: 800;

    margin: 15px 0 25px;

}

/* =====================================================
   INFO
===================================================== */

.info-grid {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 12px;

    margin-top: 20px;

}

.info-row {

    background: #f7f7f7;

    border-radius: 12px;

    padding: 15px 10px;

    font-size: 17px;

    text-align: center;

}

.info-row strong {

    display: block;

    font-size: 14px;

    color: #777;

    margin-bottom: 6px;

}

/* =====================================================
   DETAIL GALLERY TITLE
===================================================== */

.gallery-title {

    margin-top: 40px;

    padding-top: 25px;

    border-top: 1px solid #eee;

    text-align: center;

    font-size: 21px;

    font-weight: 800;

}

.gallery-arrow {

    display: block;

    font-size: 28px;

    margin-bottom: 5px;

    animation: arrowDown 1.2s infinite;

}

@keyframes arrowDown {

    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(6px);
    }

}

.gallery-subtitle {

    margin-top: 6px;

    color: #777;

    font-size: 14px;

}

/* =====================================================
   GALLERY
===================================================== */

.gallery {

    margin-top: 20px;

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 12px;

}

.gallery-item {

    height: 260px;

    background: #fafafa;

    border-radius: 12px;

    overflow: hidden;

    cursor: pointer;

    transition: 0.2s ease;

}

.gallery-item:hover {

    transform: scale(1.02);

}

.gallery-item img {

    width: 100%;

    height: 100%;

    object-fit: contain;

}

/* =====================================================
   FULLSCREEN IMAGE
===================================================== */

.image-modal {

    display: none;

    position: fixed;

    z-index: 9999;

    inset: 0;

    background: rgba(0,0,0,0.92);

    align-items: center;

    justify-content: center;

    padding: 20px;

}

.image-modal img {

    max-width: 95%;

    max-height: 90vh;

    object-fit: contain;

}

.modal-close {

    position: absolute;

    top: 18px;

    right: 25px;

    color: white;

    font-size: 38px;

    cursor: pointer;

}

/* =====================================================
   LOADING
===================================================== */

.loading {

    grid-column: 1 / -1;

    text-align: center;

    padding: 60px 20px;

    color: #777;

}

/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 900px) {

    .products {

        grid-template-columns:
            repeat(3, 1fr);

    }

    .image-box {

        height: 220px;

    }

    .gallery {

        grid-template-columns:
            repeat(2, 1fr);

    }

}

@media (max-width: 650px) {

    header {

        padding: 35px 15px;

    }

    .logo {

        font-size: 27px;

    }

    .subtitle {

        font-size: 14px;

    }

    .container {

        padding: 12px;

    }

    .products {

        grid-template-columns:
            repeat(2, 1fr);

        gap: 10px;

    }

    .image-box {

        height: 190px;

    }

    .card-info {

        padding: 11px;

    }

    .name {

        font-size: 16px;

    }

    .price {

        font-size: 17px;

    }

    .detail {

        padding: 12px;

    }

    .detail-image-box {

        height: 350px;

    }

    .detail-name {

        font-size: 27px;

    }

    .detail-price {

        font-size: 24px;

    }

    .info-grid {

        grid-template-columns:
            1fr;

    }

    .info-row {

        font-size: 17px;

    }

    .gallery {

        grid-template-columns:
            1fr 1fr;

        gap: 8px;

    }

    .gallery-item {

        height: 200px;

    }

}

/* =====================================================
   VERY SMALL MOBILE
===================================================== */

@media (max-width: 400px) {

    .products {

        gap: 8px;

    }

    .image-box {

        height: 170px;

    }

    .gallery-item {

        height: 170px;

    }

}

</style>

</head>

<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <div class="logo">
        TSPORT
    </div>

    <div class="subtitle">
        Vợt Cầu Lông Lướt
    </div>

</header>


<div class="container">


<!-- =====================================================
     SEARCH
===================================================== -->

<div class="search-box">

    <input
        id="search"
        class="search"
        type="text"
        placeholder="🔎 Tìm vợt, mã, hãng..."
    >

</div>


<!-- =====================================================
     FILTER
===================================================== -->

<div class="filters">

    <select id="brandFilter">

        <option value="">
            Tất cả hãng
        </option>

    </select>


    <select id="styleFilter">

        <option value="">
            Tất cả lối đánh
        </option>

    </select>

</div>


<!-- =====================================================
     COUNT
===================================================== -->

<div
    id="count"
    class="count">
</div>


<!-- =====================================================
     PRODUCTS
===================================================== -->

<div
    id="products"
    class="products">

    <div class="loading">
        Đang tải sản phẩm...
    </div>

</div>


<!-- =====================================================
     DETAIL
===================================================== -->

<div
    id="detail"
    class="detail">
</div>


</div>


<!-- =====================================================
     IMAGE MODAL
===================================================== -->

<div
    id="imageModal"
    class="image-modal"
    onclick="closeImageModal()"
>

    <div
        class="modal-close"
        onclick="closeImageModal()"
    >
        ×
    </div>

    <img
        id="modalImage"
        src=""
        alt=""
    >

</div>


<script>


/* =====================================================
   GOOGLE SHEETS
===================================================== */

const SHEET_URL =
"https://docs.google.com/spreadsheets/d/1PqbleAOXsLtT1h8emp1zepyovsBOINSPNu8JTWPgm7Y/gviz/tq?tqx=out:csv";


/* =====================================================
   CLOUDFLARE IMAGE API
===================================================== */

const IMAGE_API =
"https://tsport-image-api.ntr9766.workers.dev/";


/* =====================================================
   DATA
===================================================== */

let products = [];


/* =====================================================
   GOOGLE DRIVE IMAGE
===================================================== */

function getImageUrl(url) {

    if (!url) return "";

    url = url.trim();

    let id = "";

    let match =
        url.match(
            /\/file\/d\/([^/]+)/
        );

    if (match) {

        id = match[1];

    }


    if (!id) {

        match =
            url.match(
                /[?&]id=([^&]+)/
            );

        if (match) {

            id = match[1];

        }

    }


    if (id) {

        return `
            https://drive.google.com/thumbnail
            ?id=${id}&sz=w1000
        `.replace(/\s+/g, "");

    }


    return url;

}


/* =====================================================
   CSV PARSER
===================================================== */

function parseCSV(text) {

    const rows = [];

    let row = [];

    let value = "";

    let insideQuotes = false;


    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        const char = text[i];

        const next = text[i + 1];


        if (
            char === '"' &&
            insideQuotes &&
            next === '"'
        ) {

            value += '"';

            i++;

            continue;

        }


        if (char === '"') {

            insideQuotes =
                !insideQuotes;

            continue;

        }


        if (
            char === "," &&
            !insideQuotes
        ) {

            row.push(value);

            value = "";

            continue;

        }


        if (
            (
                char === "\n" ||
                char === "\r"
            ) &&
            !insideQuotes
        ) {

            if (
                char === "\r" &&
                next === "\n"
            ) {

                i++;

            }


            row.push(value);


            if (
                row.some(
                    x =>
                        x.trim() !== ""
                )
            ) {

                rows.push(row);

            }


            row = [];

            value = "";

            continue;

        }


        value += char;

    }


    if (
        value ||
        row.length
    ) {

        row.push(value);


        if (
            row.some(
                x =>
                    x.trim() !== ""
            )
        ) {

            rows.push(row);

        }

    }


    if (rows.length < 2) {

        return [];

    }


    const headers =
        rows[0].map(
            x =>
                x
                    .trim()
                    .replace(
                        /^\uFEFF/,
                        ""
                    )
        );


    return rows
        .slice(1)
        .map(row => {

            const item = {};


            headers.forEach(
                (
                    header,
                    index
                ) => {

                    item[header] =
                        (
                            row[index] ||
                            ""
                        ).trim();

                }
            );


            return item;

        });

}


/* =====================================================
   LOAD PRODUCTS
===================================================== */

async function loadProducts() {

    try {

        const response =
            await fetch(
                SHEET_URL +
                "&t=" +
                Date.now()
            );


        if (!response.ok) {

            throw new Error(
                "Không thể tải Google Sheet"
            );

        }


        const text =
            await response.text();


        products =
            parseCSV(text);


        if (!products.length) {

            throw new Error(
                "Không có dữ liệu"
            );

        }


        createFilters();

        displayProducts(
            products
        );


    } catch (error) {

        console.error(error);


        document.getElementById(
            "products"
        ).innerHTML = `

            <div class="loading">

                Không thể tải dữ liệu.

                <br><br>

                Vui lòng thử tải lại trang.

            </div>

        `;

    }

}


/* =====================================================
   FILTER OPTIONS
===================================================== */

function createFilters() {

    const brandFilter =
        document.getElementById(
            "brandFilter"
        );


    const styleFilter =
        document.getElementById(
            "styleFilter"
        );


    brandFilter.innerHTML =
        `
        <option value="">
            Tất cả hãng
        </option>
        `;


    styleFilter.innerHTML =
        `
        <option value="">
            Tất cả lối đánh
        </option>
        `;


    const brands =
        [
            ...new Set(
                products
                    .map(
                        p =>
                            p["Hãng"]
                    )
                    .filter(Boolean)
            )
        ];


    const styles =
        [
            ...new Set(
                products
                    .map(
                        p =>
                            p["Lối đánh"]
                    )
                    .filter(Boolean)
            )
        ];


    brands.forEach(
        brand => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                brand;


            option.textContent =
                brand;


            brandFilter.appendChild(
                option
            );

        }
    );


    styles.forEach(
        style => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                style;


            option.textContent =
                style;


            styleFilter.appendChild(
                option
            );

        }
    );

}


/* =====================================================
   PRICE
===================================================== */

function formatPrice(price) {

    if (!price) return "";

    const number =
        Number(
            String(price)
                .replace(
                    /[^\d]/g,
                    ""
                )
        );


    if (!number) {

        return price;

    }


    return number.toLocaleString(
        "vi-VN"
    ) + " ₫";

}


/* =====================================================
   DISPLAY PRODUCTS
===================================================== */

function displayProducts(list) {

    const container =
        document.getElementById(
            "products"
        );


    const count =
        document.getElementById(
            "count"
        );


    container.innerHTML = "";


    count.textContent =
        `${list.length} sản phẩm`;


    if (!list.length) {

        container.innerHTML = `

            <div class="loading">

                Không tìm thấy vợt.

            </div>

        `;

        return;

    }


    list.forEach(
        product => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "card";


            const image =
                getImageUrl(
                    product["Ảnh"]
                );


            let imageHTML = "";


            if (image) {

                imageHTML = `

                    <img
                        src="${image}"
                        alt="${escapeHTML(
                            product["Tên vợt"] || ""
                        )}"
                        loading="lazy"
                        onerror="
                            this.style.display='none';
                            this.parentElement.innerHTML +=
                            '<div class=\\'no-image\\'>Không có ảnh</div>';
                        "
                    >

                `;

            } else {

                imageHTML = `

                    <div class="no-image">

                        Không có ảnh

                    </div>

                `;

            }


            card.innerHTML = `

                <div class="image-box">

                    ${imageHTML}

                </div>


                <div class="card-info">

                    <div class="brand">

                        ${escapeHTML(
                            product["Hãng"] || ""
                        )}

                    </div>


                    <div class="name">

                        ${escapeHTML(
                            product["Tên vợt"] || ""
                        )}

                    </div>


                    <div class="price">

                        ${formatPrice(
                            product["Giá"]
                        )}

                    </div>


                    <div class="meta">

                        ${escapeHTML(
                            product["Tình trạng vợt"] || ""
                        )}

                        ·

                        ${escapeHTML(
                            product["Tình trạng cước"] || ""
                        )}

                        <br>

                        ${escapeHTML(
                            product["Lối đánh"] || ""
                        )}

                    </div>

                </div>

            `;


            card.onclick =
                () =>
                    showDetail(
                        product
                    );


            container.appendChild(
                card
            );

        }
    );

}


/* =====================================================
   LOAD DETAIL GALLERY
===================================================== */

async function loadGallery(
    folder,
    galleryElement
) {

    if (!folder) {

        galleryElement.innerHTML = `

            <div class="loading">

                Chưa có ảnh chi tiết.

            </div>

        `;

        return;

    }


    try {

        const url =
            IMAGE_API +
            "?folder=" +
            encodeURIComponent(
                folder
            );


        const response =
            await fetch(url);


        if (!response.ok) {

            throw new Error(
                "Không thể tải gallery"
            );

        }


        const data =
            await response.json();


        if (
            !data.success ||
            !data.images ||
            !data.images.length
        ) {

            galleryElement.innerHTML = `

                <div class="loading">

                    Chưa có ảnh chi tiết.

                </div>

            `;

            return;

        }


        galleryElement.innerHTML = "";


        data.images.forEach(
            image => {

                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "gallery-item";


                item.innerHTML = `

                    <img
                        src="${image.url}"
                        alt="Ảnh chi tiết"
                        loading="lazy"
                    >

                `;


                item.onclick =
                    () =>
                        openImageModal(
                            image.url
                        );


                galleryElement.appendChild(
                    item
                );

            }
        );


    } catch (error) {

        console.error(error);


        galleryElement.innerHTML = `

            <div class="loading">

                Không thể tải ảnh chi tiết.

            </div>

        `;

    }

}


/* =====================================================
   DETAIL
===================================================== */

function showDetail(product) {

    document.getElementById(
        "products"
    ).style.display =
        "none";


    document.getElementById(
        "count"
    ).style.display =
        "none";


    document.querySelector(
        ".filters"
    ).style.display =
        "none";


    document.querySelector(
        ".search-box"
    ).style.display =
        "none";


    const detail =
        document.getElementById(
            "detail"
        );


    detail.style.display =
        "block";


    const image =
        getImageUrl(
            product["Ảnh"]
        );


    let imageHTML = "";


    if (image) {

        imageHTML = `

            <img
                class="detail-image"
                src="${image}"
                alt="${escapeHTML(
                    product["Tên vợt"] || ""
                )}"
            >

        `;

    } else {

        imageHTML = `

            <div class="no-image">

                Không có ảnh

            </div>

        `;

    }


    /*
       Lấy folder từ cột
       "Ảnh chi tiết"

       Ví dụ:

       https://tsport-image-api.ntr9766.workers.dev/?folder=TSPORT/YZ001%20-%20Astrox%20100ZZ
    */

    let folder = "";


    if (
        product["Ảnh chi tiết"]
    ) {

        try {

            const detailURL =
                new URL(
                    product[
                        "Ảnh chi tiết"
                    ]
                );


            folder =
                detailURL.searchParams.get(
                    "folder"
                ) || "";

        } catch (error) {

            console.error(error);

        }

    }


    detail.innerHTML = `

        <button
            class="back"
            onclick="closeDetail()"
        >

            ← Quay lại

        </button>


        <div class="detail-image-box">

            ${imageHTML}

        </div>


        <div class="detail-content">

            <div class="detail-brand">

                ${escapeHTML(
                    product["Hãng"] || ""
                )}

            </div>


            <div class="detail-name">

                ${escapeHTML(
                    product["Tên vợt"] || ""
                )}

            </div>


            <div class="detail-price">

                ${formatPrice(
                    product["Giá"]
                )}

            </div>


            <div class="info-grid">


                <div class="info-row">

                    <strong>Mã vợt</strong>

                    ${escapeHTML(
                        product["Mã"] || "-"
                    )}

                </div>


                <div class="info-row">

                    <strong>Tình trạng cước</strong>

                    ${escapeHTML(
                        product["Tình trạng cước"] || "-"
                    )}

                </div>


                <div class="info-row">

                    <strong>Tình trạng vợt</strong>

                    ${escapeHTML(
                        product["Tình trạng vợt"] || "-"
                    )}

                </div>


                <div class="info-row">

                    <strong>Lối đánh</strong>

                    ${escapeHTML(
                        product["Lối đánh"] || "-"
                    )}

                </div>


                <div class="info-row">

                    <strong>Ghi chú</strong>

                    ${escapeHTML(
                        product["Ghi chú"] || "-"
                    )}

                </div>


            </div>


            <div class="gallery-title">

                <span class="gallery-arrow">
                    ↓
                </span>

                Ảnh chi tiết của vợt

                <div class="gallery-subtitle">

                    Bấm vào ảnh để xem ảnh lớn

                </div>

            </div>


            <div
                id="detailGallery"
                class="gallery"
            >

                <div class="loading">

                    Đang tải ảnh chi tiết...

                </div>

            </div>


        </div>

    `;


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });


    const gallery =
        document.getElementById(
            "detailGallery"
        );


    loadGallery(
        folder,
        gallery
    );

}


/* =====================================================
   CLOSE DETAIL
===================================================== */

function closeDetail() {

    document.getElementById(
        "products"
    ).style.display =
        "grid";


    document.getElementById(
        "count"
    ).style.display =
        "block";


    document.querySelector(
        ".filters"
    ).style.display =
        "flex";


    document.querySelector(
        ".search-box"
    ).style.display =
        "block";


    document.getElementById(
        "detail"
    ).style.display =
        "none";


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}


/* =====================================================
   SEARCH + FILTER
===================================================== */

function filterProducts() {

    const search =
        document.getElementById(
            "search"
        )
        .value
        .toLowerCase()
        .trim();


    const brand =
        document.getElementById(
            "brandFilter"
        ).value;


    const style =
        document.getElementById(
            "styleFilter"
        ).value;


    const filtered =
        products.filter(
            product => {

                const text =
                    Object.values(
                        product
                    )
                    .join(" ")
                    .toLowerCase();


                return (

                    text.includes(
                        search
                    )

                    &&

                    (
                        !brand ||
                        product["Hãng"] ===
                        brand
                    )

                    &&

                    (
                        !style ||
                        product["Lối đánh"] ===
                        style
                    )

                );

            }
        );


    displayProducts(
        filtered
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   IMAGE MODAL
===================================================== */

function openImageModal(url) {

    const modal =
        document.getElementById(
            "imageModal"
        );


    const image =
        document.getElementById(
            "modalImage"
        );


    image.src =
        url;


    modal.style.display =
        "flex";

}


function closeImageModal() {

    const modal =
        document.getElementById(
            "imageModal"
        );


    modal.style.display =
        "none";

}


/* =====================================================
   EVENTS
===================================================== */

document
    .getElementById(
        "search"
    )
    .addEventListener(
        "input",
        filterProducts
    );


document
    .getElementById(
        "brandFilter"
    )
    .addEventListener(
        "change",
        filterProducts
    );


document
    .getElementById(
        "styleFilter"
    )
    .addEventListener(
        "change",
        filterProducts
    );


/* =====================================================
   START
===================================================== */

loadProducts();

</script>
